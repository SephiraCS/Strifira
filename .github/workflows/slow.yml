name: Slow Tests

# The slow suite (AGENTS.md): every integration test that is not on a
# deploy's critical path. It runs next to ci.yml after each push to main,
# nightly, on demand (`gh workflow run slow.yml --ref main`), and on pull
# requests labelled `full-ci` (adding the label starts a run). It never
# blocks a deploy and is never a required check; a failure files or updates
# the open "Slow test suite failed" issue (scripts/ci/report-failure.sh).
#
# Membership (see the Makefile): Go tests named TestSlow*, the Playwright
# specs not in FAST_SPECS (UI/playwright.config.ts), and the disposable live
# checks in scripts/check-*-live.*. Release commits are pushed with
# GITHUB_TOKEN, so they do not start this workflow.
on:
  push:
    branches: [main]
    # Docs-only pushes cannot break a suite; the nightly run covers them.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'assets/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

# A newer push tests a superset, so an older run still in progress yields.
# Pull request events that run nothing (no `full-ci` label, or another label
# added) use their own group so they never cancel a real run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))) && 'run' || 'noop' }}
  cancel-in-progress: true

permissions:
  contents: read

# All jobs run on GitHub-hosted runners.
jobs:
  backend:
    if: (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same throwaway services as ci.yml's test job.
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: ku
          POSTGRES_PASSWORD: ku
          POSTGRES_DB: ku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ku -d ku_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: docker.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ku:ku@localhost:5432/ku_test?sslmode=disable
      TEST_DATABASE_URL: postgres://ku:ku@localhost:5432/ku_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # 1.27.2, not go.mod's floor: gofmt's output changed after 1.26,
          # and check-gofmt must match the toolchain the code is formatted
          # with (the former Forgejo builder image also ran 1.27.2).
          go-version: 1.27.2
          cache: true
          cache-dependency-path: BE/go.sum

      - name: Slow suite (backend)
        run: make test-slow-backend

  frontend:
    if: (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # The npm cache, keyed by the lockfiles: every job restores it, only ci.yml on main saves it. A
      # release commit changes UI/package-lock.json, so a miss falls back to the newest one.
      - id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-ui-${{ runner.os }}-${{ hashFiles('UI/package-lock.json') }}
          restore-keys: npm-ui-${{ runner.os }}-

      # Browsers are keyed by the locked Playwright version; only main saves them.
      - id: playwright-version
        run: echo "version=$(node -p 'require("./UI/package-lock.json").packages["node_modules/playwright"].version')" >> "$GITHUB_OUTPUT"
      - id: playwright
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-ffmpeg

      - name: Install dependencies
        working-directory: UI
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium ffmpeg

      # The Playwright web server builds the app first.
      - name: Slow suite (browser)
        run: make test-slow-frontend E2E_FLAGS="--workers=2"

      # Keep failure context in the log; the artifacts land in the run.
      - name: Print failure context
        if: failure()
        working-directory: UI
        run: |
          find test-results -name 'error-context.md' -print -exec cat {} \; 2>/dev/null | head -c 200000 || true

  live:
    if: (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # 1.27.2, not go.mod's floor: gofmt's output changed after 1.26,
          # and check-gofmt must match the toolchain the code is formatted
          # with (the former Forgejo builder image also ran 1.27.2).
          go-version: 1.27.2
          cache: true
          cache-dependency-path: BE/go.sum

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # The npm cache, keyed by the lockfiles: every job restores it, only ci.yml on main saves it. A
      # release commit changes UI/package-lock.json, so a miss falls back to the newest one.
      - id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-ui-${{ runner.os }}-${{ hashFiles('UI/package-lock.json') }}
          restore-keys: npm-ui-${{ runner.os }}-

      # Browsers are keyed by the locked Playwright version; only main saves them.
      - id: playwright-version
        run: echo "version=$(node -p 'require("./UI/package-lock.json").packages["node_modules/playwright"].version')" >> "$GITHUB_OUTPUT"
      - id: playwright
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-ffmpeg

      - name: Install dependencies
        working-directory: UI
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium ffmpeg

      # The screen-share check always runs. The AI provider check runs only
      # when the KU_LIVE_PROVIDER_* secrets are set; without them it is
      # skipped with a notice. check-dev-box-live.py needs an authenticated
      # coding CLI on a dev VM and stays a manual check. The live checks
      # start their own throwaway containers with the runner's podman,
      # which needs no store or cgroup workarounds outside the old nested
      # Forgejo runner.
      - name: Slow suite (live checks)
        env:
          KU_LIVE_PROVIDER_KEY: ${{ secrets.KU_LIVE_PROVIDER_KEY }}
          KU_LIVE_PROVIDER_URL: ${{ secrets.KU_LIVE_PROVIDER_URL }}
          KU_LIVE_PROVIDER_MODEL: ${{ secrets.KU_LIVE_PROVIDER_MODEL }}
        run: make test-slow-live

  report:
    needs: [backend, frontend, live]
    # Pull requests show their own failures; only main/nightly file issues.
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: File the failure as an issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_TITLE: 'Slow test suite failed'
          REPRO: |
            # PostgreSQL and Redis first: make dev-start-services
            make test-slow
            # or one part: make test-slow-backend | test-slow-frontend | test-slow-live
        run: scripts/ci/report-failure.sh
