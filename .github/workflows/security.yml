name: Security Scan

on:
  push:
    tags: ['v*']
  # Pull requests scan only when Go code or npm dependencies change; the
  # nightly run still catches new advisories against unchanged code.
  pull_request:
    branches: [main]
    paths:
      - 'BE/**'
      - 'UI/package.json'
      - 'UI/package-lock.json'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 0 * * *'

# Pull requests run per ref and yield to newer pushes. Tag and nightly runs
# share one queue, so two of them never file the same failure issue at once
# (scripts/ci/report-failure.sh also folds a duplicate opened in a race
# into the oldest issue).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build, vet, and test coverage lives in ci.yml.
permissions:
  contents: read

# All jobs run on GitHub-hosted runners.
jobs:
  go-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # 1.27.2, not go.mod's floor: gofmt's output changed after 1.26,
          # and check-gofmt must match the toolchain the code is formatted
          # with (the former Forgejo builder image also ran 1.27.2).
          go-version: 1.27.2
          cache: true
          cache-dependency-path: BE/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - working-directory: BE
        run: govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # npm audit reads the lockfile; no install needed.
      - working-directory: UI
        run: npm audit --audit-level=high

  # Nightly and tag scans gate nothing, so a failure files (or updates) a
  # GitHub issue instead of going unnoticed. Pull requests show their own.
  report:
    needs: [go-security, frontend-security]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: File the failure as an issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_TITLE: 'Security scan failed'
          REPRO: |
            (cd BE && govulncheck ./...)
            (cd UI && npm audit --audit-level=high)
        run: scripts/ci/report-failure.sh
