name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-runs the pipeline when a runner hiccup fails a good build; on main
  # that also re-cuts the release: `gh workflow run ci.yml --ref main`.
  workflow_dispatch:

# Main never cancels: every main run cuts the release of its commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Go and Node.js come from the setup actions; PostgreSQL and Redis run as
# service containers.
#
# Every push to main deploys to alpha: Coolify watches the repository
# webhook, builds the root Dockerfile itself, and health-gates the new
# instance with rollback (SOURCE_COMMIT is baked into the binary and
# reported by /health). CI never touches the server. The Release job
# verifies the rollout by polling /health until it serves the pushed
# commit, then bumps the version and tags the release; the release commit
# itself is rolled via the Coolify deployment API, since pushes made with
# GITHUB_TOKEN trigger no webhook.
#
# Tests (AGENTS.md): integration tests only, in two suites. This workflow
# runs the fast suite (`make test-fast`); the slow suite (`make test-slow`)
# runs in slow.yml and never blocks anything. Pull requests never edit
# versions (scripts/ci/release.sh). All jobs run on GitHub-hosted runners.
jobs:
  # Pull requests run only the jobs whose inputs they change; pushes to
  # main and workflow_dispatch run everything. The `test` job at the end
  # aggregates the result.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'BE/**'
              - 'devmachine/**'
              - 'scripts/ci/check-image-versions.sh'
              - 'scripts/ci/check-test-database.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            web:
              - 'UI/**'
              - 'WEB/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'UI/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # TS-795 switch guard: fails when the change adds an on/off setting.
  # Vendored into scripts/ci/zero-config-check.py from TerraScale/ts-builder
  # (guard ref 8dacab4); the TerraScale server was decommissioned in the
  # Sephira company move, so this vendored copy is the maintained source.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          ZERO_CONFIG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ZERO_CONFIG_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ] || [ "$ZERO_CONFIG_BASE" = "0000000000000000000000000000000000000000" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 scripts/ci/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"

  check:
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # The npm cache, keyed by the lockfiles: every job restores it, only main saves it. A
      # release commit changes UI/package-lock.json, so a miss falls back to the newest one.
      - id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-ui-web-${{ runner.os }}-${{ hashFiles('UI/package-lock.json', 'WEB/package-lock.json') }}
          restore-keys: npm-ui-web-${{ runner.os }}-

      - name: Install UI dependencies
        working-directory: UI
        run: npm ci --no-audit --no-fund

      - name: Svelte check (UI)
        working-directory: UI
        run: npm run check

      - name: Install marketing site dependencies
        working-directory: WEB
        run: npm ci --no-audit --no-fund

      - name: Svelte check (WEB)
        working-directory: WEB
        run: npm run check

      - name: Build and SEO validation
        working-directory: WEB
        run: npm run validate

      # Browsers are keyed by the locked Playwright version; only main saves them.
      - id: playwright-version
        run: echo "version=$(node -p 'require("./WEB/package-lock.json").packages["node_modules/playwright"].version')" >> "$GITHUB_OUTPUT"
      - id: playwright
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      # The responsive suite launches a headless browser; the runners do not
      # bake one in (the former Forgejo job image did).
      - name: Install the Playwright browser
        working-directory: WEB
        run: npx playwright install chromium
      - if: github.event_name == 'push' && steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.cache-primary-key }}

      - name: Responsive layout tests
        working-directory: WEB
        run: npm run test:responsive

      - if: github.event_name == 'push' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

  # Fast backend suite. The required check is the `test` aggregate below.
  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Throwaway test state; readiness is enforced by the health options,
      # so the first step already sees a migrated-ready database.
      postgres:
        image: docker.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: strifira
          POSTGRES_PASSWORD: strifira
          POSTGRES_DB: strifira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strifira -d strifira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: docker.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://strifira:strifira@localhost:5432/strifira_test?sslmode=disable
      TEST_DATABASE_URL: postgres://strifira:strifira@localhost:5432/strifira_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # 1.27.2, not go.mod's floor: gofmt's output changed after 1.26,
          # and check-gofmt must match the toolchain the code is formatted
          # with (the former Forgejo builder image also ran 1.27.2).
          go-version: 1.27.2
          cache: true
          cache-dependency-path: BE/go.sum

      - name: Check the devmachine image tool pins
        run: sh scripts/ci/check-image-versions.sh

      - run: go vet ./...
        working-directory: BE

      # The timeout covers a whole package, so allow 10m while retaining
      # stacks before the 30m job limit.
      - name: Fast suite (backend) with coverage
        run: |
          set -euo pipefail
          make test-fast-backend \
            GO_TEST_FLAGS="-race -count=1 -timeout=10m -coverprofile=coverage.out -covermode=atomic"
          (cd BE && go tool cover -func=coverage.out | tail -1)

      # Runs even when tests fail, so both problems show in one run.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: make check-gofmt

  # The fast browser suite (FAST_SPECS in UI/playwright.config.ts), split
  # across three runners. Each shard builds the app itself and hands the
  # build to Playwright (E2E_PREBUILT=1). Workers stay at two per shard.
  e2e:
    name: e2e shard ${{ matrix.shard }}
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: UI
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # The npm cache, keyed by the lockfiles: every job restores it, only main saves it. A
      # release commit changes UI/package-lock.json, so a miss falls back to the newest one.
      - id: npm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-ui-${{ runner.os }}-${{ hashFiles('UI/package-lock.json') }}
          restore-keys: npm-ui-${{ runner.os }}-

      - run: npm ci --no-audit --no-fund

      # Browsers are keyed by the locked Playwright version; only main saves them.
      - id: playwright-version
        working-directory: .
        run: echo "version=$(node -p 'require("./UI/package-lock.json").packages["node_modules/playwright"].version')" >> "$GITHUB_OUTPUT"
      - id: playwright
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-ffmpeg

      - run: npm run build

      - name: Fast suite (browser)
        working-directory: .
        env:
          E2E_PREBUILT: '1'
        run: |
          (cd UI && npx playwright install chromium ffmpeg)
          make test-fast-frontend E2E_FLAGS="--shard=${{ matrix.shard }}/3 --workers=2"

      - if: github.event_name == 'push' && matrix.shard == 1 && steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.cache-primary-key }}

      - if: github.event_name == 'push' && matrix.shard == 1 && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      # Artifacts work on GitHub: keep the failure context in the log and
      # attach it for reading without digging through the run.
      - name: Print failure context
        if: failure()
        run: |
          find test-results -name 'error-context.md' -print -exec cat {} \; 2>/dev/null | head -c 200000 || true

      - name: Upload failure context
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: error-context-shard-${{ matrix.shard }}
          path: UI/test-results/**/error-context.md
          if-no-files-found: ignore

  # The required check. It always reports: green when every gate passed or
  # was skipped as unaffected, red when any failed or was cancelled.
  test:
    needs: [changes, guard, check, backend, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done

  # Cuts the next patch release of the deployed commit once the whole test
  # aggregate is green, waiting for alpha to serve the pushed commit
  # (Coolify rolls the deployment itself off the repository webhook and
  # bakes SOURCE_COMMIT into the binary), then bumps UI/package.json and
  # the OpenAPI version in a "[skip ci]" commit on main, tags it, and
  # creates the GitHub release. The release commit only moves version
  # fields and the release manifest, so it skips the test suites; it is
  # rolled to alpha via the Coolify deployment API, since pushes made with
  # GITHUB_TOKEN never trigger webhooks. No loop: they also never start
  # workflows, and "[skip ci]" keeps CI off that commit (see
  # scripts/ci/release.sh).
  release:
    needs: [guard, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALPHA_BASE_URL: https://strifira.sephira.app.br
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The Coolify deployment of the pushed commit runs in parallel with
      # the test suites (it starts on the repository webhook), so by the
      # time it is healthy the checks have usually settled too; a commit
      # that never rolls (broken build, failed health gate) times out here
      # instead of being released.
      - name: Wait for alpha to serve the pushed commit
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 25 * 60 ))
          version=
          while :; do
            version=$(curl -fsS --max-time 10 "$ALPHA_BASE_URL/health" | jq -r '.version // empty') || version=
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "alpha is serving ${GITHUB_SHA}."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 25m waiting for alpha to serve ${GITHUB_SHA} (last version: ${version:-unreachable})." >&2
              exit 1
            fi
            echo "alpha is at ${version:-unreachable}; waiting for ${GITHUB_SHA}."
            sleep 30
          done

      - name: Bump the version, tag and create the release
        id: release
        run: scripts/ci/release.sh "${{ github.sha }}"

  # The Release job has never blocked anything a deploy needs, so its
  # failure must be seen and owned the same way slow-suite failures are:
  # one open issue collects the redacted log tails of every failed job.
  report-release-failure:
    needs: [release]
    # failure() chained with && never fired on Forgejo; always() plus the
    # explicit needs result is the dependable form.
    if: >-
      always()
      && !cancelled()
      && needs.release.result == 'failure'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out the source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: File the failure as an issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_TITLE: 'Release failed'
          LOG_LINES: 150
          REPRO: |
            # The release resumes idempotently once the cause is fixed:
            gh workflow run ci.yml --ref main
        run: scripts/ci/report-failure.sh
