      - $ref: "#/components/parameters/Slug"
      - name: docId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: documentCollabSocket
      tags: [Docs]
      summary: Real-time collaborative editing WebSocket
      description: |
        Per-document Yjs relay. The first frame must be `join` with the
        display identity; the server answers with `init` (base64 Yjs update
        log), `peers`, then relays `update` frames between editors and
        `cursor` presence frames (Yjs relative positions). Guests join
        read-only. Updates are persisted in an append-only log, compacted
        via `compact.request`/`snapshot` exchanges.
      responses:
        "101":
          description: WebSocket upgrade.

