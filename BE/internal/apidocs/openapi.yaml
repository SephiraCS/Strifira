      responses:
        "200":
          description: Registered webhooks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Create a webhook
      description: "Requires: workspace:manage. Deliveries are signed with the secret (HMAC)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookRequest" }
      responses:
        "201":
          description: Created webhook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }

  /api/workspaces/{slug}/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateWebhook
      tags: [Webhooks]
      summary: Update a webhook
      description: "Requires: workspace:manage."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWebhookRequest" }
      responses:
        "200":
          description: Updated webhook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete a webhook
      description: "Requires: workspace:manage."
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/ai-settings:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getAISettings
      tags: [AI]
      summary: Get workspace AI settings
      description: "Readable by members (issue:read); never returns the stored key, only `has_api_key`."
      responses:
        "200":
          description: AI settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettings" }
    patch:
      operationId: updateAISettings
      tags: [AI]
      summary: Update workspace AI settings
      description: "Requires: owner. The API key is encrypted at rest and never read back."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAISettingsRequest" }
      responses:
        "200":
          description: Updated AI settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettings" }

  /api/workspaces/{slug}/ai-settings/test:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: testAIConnection
      tags: [AI]
      summary: Test saved AI provider configuration
      description: |
        Requires: owner. Sends a short HTML completion request using only
        the saved base URL, model, and encrypted API key. Times out after
        15 seconds. Never returns the key or generated content.
      responses:
        "200":
          description: Saved provider completed the request successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIConnectionTestResponse" }
        "400":
          description: AI_NOT_CONFIGURED; save a base URL, model, and API key first.
        "403":
          description: Only the workspace owner can test AI settings.
        "502":
          description: AI_PROVIDER_ERROR; the completion failed or returned invalid content.

  /api/workspaces/{slug}/ai-settings/issue-copy-prompt:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getIssueCopyPrompt
      tags: [AI]
      summary: Effective issue-copy prompt
      description: Returns the configured prompt plus the built-in default (issue:read).
      responses:
        "200":
          description: Prompt pair.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue_copy_prompt: { type: string }
                  default_issue_copy_prompt: { type: string }

  /api/workspaces/{slug}/ai/rework:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: reworkText
      tags: [AI]
      summary: Rework text with AI
      description: |
        Requires: issue:update. Workspace-scoped text rework used by
        comment editors and the create-issue dialog. Returns
        `AI_NOT_CONFIGURED` (400) when the workspace has no AI settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 8000 }
                context: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Reworked text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }

  /api/github/webhook:
    post:
      operationId: githubWebhook
      tags: [GitHub]
      summary: Inbound GitHub webhook
      description: |
        Public endpoint called by GitHub for `push`, `pull_request`,
        `create`, `status`, `check_run` and `workflow_run` events. Every
        delivery must carry a valid `X-Hub-Signature-256`
        (`sha256=` + hex HMAC-SHA256 of the raw body, using the shared secret
        strifira generated when the repo was linked; the legacy `X-Hub-Signature`
        SHA-1 variant is accepted as a fallback); invalid signatures are
        dropped.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/workspaces/{slug}/github/status:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: githubStatus
      tags: [GitHub]
      summary: Integration status
      description: Connection state, account, and linked repos.
      responses:
        "200":
          description: Status payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubStatus" }

  /api/workspaces/{slug}/github/connection:
    parameters:
      - $ref: "#/components/parameters/Slug"
    put:
      operationId: githubConnect
      tags: [GitHub]
      summary: Connect a GitHub token
      description: |
        Requires: workspace:manage. Per-workspace token connection; a stored
        row overrides the global instance configuration. The optional
        organization restricts repo discovery and linking to that owner
        (case-insensitive).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instance_url, token]
              properties:
                instance_url: { type: string, format: uri }
                token: { type: string, minLength: 20 }
                organization: { type: string, maxLength: 100, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    delete:
      operationId: githubDisconnect
      tags: [GitHub]
      summary: Disconnect GitHub
      description: "Requires: workspace:manage."
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/github/disable:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: githubDisable
      tags: [GitHub]
      summary: Pause the GitHub integration
      description: |
        Requires: workspace:manage. Unlinks every repository (upstream
        webhooks included) and pauses the integration for this workspace —
        it beats both the per-workspace connection and the global instance
        configuration. The stored connection is kept; enable restores it.
        Idempotent.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/github/enable:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: githubEnable
      tags: [GitHub]
      summary: Resume the GitHub integration
      description: "Requires: workspace:manage. Clears the pause marker; idempotent."
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/github/repos:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: githubListRepos
      tags: [GitHub]
      summary: List available and linked repos
      description: "Requires: workspace:manage."
      responses:
        "200":
          description: Repos visible to the token.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GitHubRepo" }
    post:
      operationId: githubLinkRepos
      tags: [GitHub]
      summary: Link repos
      description: |
        Requires: workspace:manage. Linking creates strifira-generated signed
        webhooks on each repo (push/pull_request/create + Actions
        completion).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [github_repo_ids]
              properties:
                github_repo_ids:
                  type: array
                  minItems: 1
                  items: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/github/repos/{id}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: githubUnlinkRepo
      tags: [GitHub]
      summary: Unlink a repo
      description: "Requires: workspace:manage."
      responses:
        "200": { $ref: "#/components/responses/Ok" }


  /api/workspaces/{slug}/github/repos/{repoId}/actions/runs:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/GitHubLinkedRepoId"
    get:
      operationId: githubListActionRuns
      tags: [GitHub]
      summary: List workflow runs for a linked repository
      description: |
        Requires: issue:read. Only active repository links in this workspace
        can be queried. Filters are forwarded to GitHub, which filters runs by
        status (`queued`, `in_progress`, `completed`); `waiting` and `running`
        are accepted aliases for the first two. A `ref` filter accepts both
        full refs (`refs/heads/x`) and branch names. Filter strings are
        limited to 512 bytes and cannot contain NUL, CR, or LF. Repeated
        filter and pagination parameters are rejected.
      parameters:
        - $ref: "#/components/parameters/GitHubActionsPage"
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, waiting, running, in_progress, completed]
        - name: ref
          in: query
          schema: { type: string, maxLength: 512 }
        - name: event
          in: query
          schema: { type: string, maxLength: 512 }
        - name: head_sha
          in: query
          schema: { type: string, maxLength: 512 }
        - name: workflow_id
          in: query
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Paginated workflow runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubActionRunList" }
        "400": { $ref: "#/components/responses/GitHubActionsBadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/GitHubActionsNotFound" }
        "409": { $ref: "#/components/responses/GitHubActionsConflict" }
        "502": { $ref: "#/components/responses/GitHubActionsUpstreamError" }
        "503": { $ref: "#/components/responses/GitHubActionsRateLimited" }
        "504": { $ref: "#/components/responses/GitHubActionsTimeout" }

  /api/workspaces/{slug}/github/repos/{repoId}/actions/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/GitHubLinkedRepoId"
      - $ref: "#/components/parameters/GitHubActionRunId"
    get:
      operationId: githubGetActionRun
      tags: [GitHub]
      summary: Get a workflow run
      description: "Requires: issue:read. The repository must be actively linked in this workspace."
      responses:
        "200":
          description: Workflow run details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubActionRun" }
        "400": { $ref: "#/components/responses/GitHubActionsBadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/GitHubActionsNotFound" }
        "409": { $ref: "#/components/responses/GitHubActionsConflict" }
        "502": { $ref: "#/components/responses/GitHubActionsUpstreamError" }
        "503": { $ref: "#/components/responses/GitHubActionsRateLimited" }
        "504": { $ref: "#/components/responses/GitHubActionsTimeout" }

  /api/workspaces/{slug}/github/repos/{repoId}/actions/runs/{runId}/jobs:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/GitHubLinkedRepoId"
      - $ref: "#/components/parameters/GitHubActionRunId"
    get:
      operationId: githubListActionJobs
      tags: [GitHub]
      summary: List jobs in a workflow run
      description: "Requires: issue:read. GitHub's job array is paginated by Strifira."
      parameters:
        - $ref: "#/components/parameters/GitHubActionsPage"
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Paginated workflow jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubActionJobList" }
        "400": { $ref: "#/components/responses/GitHubActionsBadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/GitHubActionsNotFound" }
        "409": { $ref: "#/components/responses/GitHubActionsConflict" }
        "502": { $ref: "#/components/responses/GitHubActionsUpstreamError" }
        "503": { $ref: "#/components/responses/GitHubActionsRateLimited" }
        "504": { $ref: "#/components/responses/GitHubActionsTimeout" }

  /api/workspaces/{slug}/github/repos/{repoId}/actions/runs/{runId}/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/GitHubLinkedRepoId"
      - $ref: "#/components/parameters/GitHubActionRunId"
      - $ref: "#/components/parameters/GitHubActionJobId"
    get:
      operationId: githubGetActionJob
      tags: [GitHub]
      summary: Get a workflow job in its run
      description: |
        Requires: issue:read. Strifira resolves the job from GitHub's
        repository-scoped run-jobs list and verifies its run ID. A missing
        job or a job belonging to another run returns `ACTION_NOT_FOUND`.
        The native API provides job metadata and attempt; step details,
        job timestamps, and job URLs are available in the GitHub UI.
      responses:
        "200":
          description: Workflow job details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubActionJob" }
        "400": { $ref: "#/components/responses/GitHubActionsBadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/GitHubActionsNotFound" }
        "409": { $ref: "#/components/responses/GitHubActionsConflict" }
        "502": { $ref: "#/components/responses/GitHubActionsUpstreamError" }
        "503": { $ref: "#/components/responses/GitHubActionsRateLimited" }
        "504": { $ref: "#/components/responses/GitHubActionsTimeout" }

  /api/workspaces/{slug}/github/repos/{repoId}/actions/runs/{runId}/jobs/{jobId}/logs:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/GitHubLinkedRepoId"
      - $ref: "#/components/parameters/GitHubActionRunId"
      - $ref: "#/components/parameters/GitHubActionJobId"
    get:
      operationId: githubGetActionJobLogs
      tags: [GitHub]
      summary: Read a bounded workflow job log
      description: |
        Requires: issue:read. Strifira first verifies that the job belongs to
        this run through GitHub's repository-scoped run-jobs list. A
        missing job or mismatched run returns `ACTION_NOT_FOUND` before
        requesting any log. GitHub serves the latest attempt's logs; an
        explicit `attempt` must match the job's current attempt. At most
        2 MiB of log content is returned; `truncated` signals additional
        upstream content. GitHub expires the logs of completed runs after
        their retention period; expired logs return
        `ACTION_LOGS_UNAVAILABLE` without exposing upstream response bodies.
      parameters:
        - name: attempt
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Log content and truncation metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubActionLog" }
        "400": { $ref: "#/components/responses/GitHubActionsBadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository is not linked (`NOT_FOUND`), the job is absent from the run (`ACTION_NOT_FOUND`), or logs are absent/the upstream log API is unsupported (`ACTION_LOGS_UNAVAILABLE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409": { $ref: "#/components/responses/GitHubActionsConflict" }
        "502": { $ref: "#/components/responses/GitHubActionsUpstreamError" }
        "503": { $ref: "#/components/responses/GitHubActionsRateLimited" }
        "504": { $ref: "#/components/responses/GitHubActionsTimeout" }

  /api/workspaces/{slug}/github/repos/{repoId}/actions/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/GitHubLinkedRepoId"
      - $ref: "#/components/parameters/GitHubActionRunId"
    post:
      operationId: githubCancelActionRun
      tags: [GitHub]
      summary: Cancel an active workflow run
      description: |
        Requires: workspace:manage (workspace owner only). Strifira checks the
        upstream run state before requesting the action. Allowed states:
        `queued` or `in_progress`. This operation uses the configured workspace
        GitHub token and accepts no caller-supplied token or repository URL.
      responses:
        "202":
          description: GitHub accepted the request; refresh the run to observe the new state.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/GitHubActionsBadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/GitHubActionsNotFound" }
        "409": { $ref: "#/components/responses/GitHubActionsConflict" }
        "502": { $ref: "#/components/responses/GitHubActionsUpstreamError" }
        "503": { $ref: "#/components/responses/GitHubActionsRateLimited" }
        "504": { $ref: "#/components/responses/GitHubActionsTimeout" }

  /api/workspaces/{slug}/github/user-mappings:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: githubListUserMappings
      tags: [GitHub]
      summary: List GitHub → Strifira user mappings
      responses:
        "200":
          description: Mappings (unmapped GitHub logins fall back to unique case-insensitive member-name matches).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GitHubUserMapping" }
    put:
      operationId: githubUpdateUserMappings
      tags: [GitHub]
      summary: Replace user mappings
      description: "Requires: workspace:manage."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mappings:
                  type: array
                  items: { $ref: "#/components/schemas/GitHubUserMapping" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/github/auto-transitions:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: githubListAutoTransitions
      tags: [GitHub]
      summary: List automation rules
      responses:
        "200":
          description: Per-event status/assignee transitions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GitHubAutoTransition" }
    patch:
      operationId: githubUpdateAutoTransitions
      tags: [GitHub]
      summary: Replace automation rules
      description: |
        Requires: workspace:manage. Assignment is additive: a matched
        GitHub user (or fixed target) is *added* to the assignee set,
        never replacing it. Unknown status ids/slugs reject with
        `400 INVALID_STATUS`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transitions]
              properties:
                transitions:
                  type: array
                  items: { $ref: "#/components/schemas/GitHubAutoTransition" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/issues/{identifier}/github:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Identifier"
    get:
      operationId: issueGitHubActivity
      tags: [GitHub, Issues]
      summary: Issue code activity
      description: Linked branches, PRs, and commits for the issue's identifier.
      responses:
        "200":
          description: Code-activity entries grouped by kind.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/workspaces/{slug}/github/issue-links:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - name: identifier
        in: query
        schema: { type: string }
        description: Issue identifier (ENG-12) to look up.
    get:
      operationId: githubIssueLinks
      tags: [GitHub]
      summary: Issue links (agent helper)
      responses:
        "200":
          description: Matching links for the identifier.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/workspaces/{slug}/upload:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: uploadAsset
      tags: [Uploads]
      summary: Upload an attachment
      description: "Requires: issue:create. Returns the asset id used in issue descriptions/comments."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUpload"
      responses:
        "201":
          description: Uploaded asset metadata.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/workspaces/{slug}/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getAsset
      tags: [Uploads]
      summary: Download an asset
      description: |
        Authenticated asset delivery. `?download=1` forces a download
        disposition; non-image content types always download.
      parameters:
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Asset bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
    delete:
      operationId: deleteAsset
      tags: [Uploads]
      summary: Delete an upload (own files, or any with issue:delete)
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/issues/{identifier}/prompt-assets:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Identifier"
    post:
      operationId: signIssuePromptAssets
      tags: [Uploads]
      summary: Sign prompt asset tokens for an issue
      responses:
        "200":
          description: Signed tokens for embedding assets in AI prompts.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/workspaces/{slug}/ws:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: workspaceSocket
      tags: [Realtime]
      summary: Workspace WebSocket
      description: |
        Live event stream (issue updates, board refreshes, comment threads,
        screen-share signaling `share.presence`/`share.signal`). Server
        pings every 20s with a 30s pong deadline; clients reconnect with
        jittered exponential backoff. Authenticate with the access-token
        cookie or `?token=` query parameter.

        Screen-share presence carries share_id, role (presenter/viewer), and
        action (join/leave). Presenter joins also require the private
        presenter_token. Only active shares in this workspace may be joined.
        The membership summary includes presenter_peer, viewer_peers, and a
        distinct user viewer count; peer IDs identify individual sockets/tabs.

        share.signal carries share_id, negotiation_id (a new UUID per viewer
        attempt), data (offer/answer/candidate), and a recipient. Initial viewer
        offers may address to (presenter user UUID); replies and ICE use to_peer
        (socket UUID). Relays contain server-authenticated from (user UUID),
        from_peer (socket UUID), and the negotiation_id. Only opposite-role
        members receive relays. A reconnect gets a new peer ID and renegotiates;
        receivers discard SDP/ICE belonging to older negotiations.
      responses:
        "101":
          description: WebSocket upgrade.

  /api/notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List notifications
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [inbox, snoozed, archive] }
          description: Inbox view selector.
      responses:
        "200":
          description: Notifications plus unread count.
          content:
