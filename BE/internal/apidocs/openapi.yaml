        team_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, nullable: true }
        priority: { type: integer, nullable: true }
        assignee_id: { type: string, format: uuid, nullable: true }
        label_ids: { type: array, items: { type: string, format: uuid } }
        recurrence_rule:
          type: object
          nullable: true
        next_run_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateLabelRequest:
      type: object
      required: [name, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, example: "#8f5aff" }
        description: { type: string, nullable: true }
        parent_id: { type: string, format: uuid, nullable: true }
    UpdateLabelRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string }
        description: { type: string, nullable: true }
    Label:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        description: { type: string, nullable: true }
        parent_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateViewRequest:
      type: object
      required: [name, filters]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true }
        filters:
          type: object
          description: Issue filter JSON (same shape as listIssues query filters).
        is_shared: { type: boolean }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }
    View:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        filters: { type: object }
        is_shared: { type: boolean }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateFavoriteRequest:
      type: object
      required: [entity_type, entity_id]
      properties:
        entity_type: { type: string, enum: [project, view, team, cycle, label] }
        entity_id: { type: string, format: uuid }
    Favorite:
      type: object
      properties:
        id: { type: string, format: uuid }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        position: { type: integer }
        created_at: { type: string, format: date-time }

    CreateSharedLinkRequest:
      type: object
      required: [scope]
      properties:
        scope: { type: string, enum: [workspace, team, project, view] }
        scope_id: { type: string, format: uuid, nullable: true }
        filters: { type: object, nullable: true }
        include_description: { type: boolean, default: false }
        expires_at: { type: string, nullable: true }
    UpdateSharedLinkRequest:
      type: object
      properties:
        is_active: { type: boolean }
        include_description: { type: boolean }
        expires_at: { type: string, nullable: true }
    SharedLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        token: { type: string }
        workspace_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        scope: { type: string, enum: [workspace, team, project, view] }
        scope_id: { type: string, format: uuid, nullable: true }
        filters: { type: object, nullable: true }
        include_description: { type: boolean }
        is_active: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PublicShareMeta:
      type: object
      properties:
        scope: { type: string }
        scope_id: { type: string, format: uuid, nullable: true }
        scope_name: { type: string }
        workspace_name: { type: string }
        filters: { type: object, nullable: true }
        statuses:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              category: { type: string }
              color: { type: string, nullable: true }
              position: { type: integer }
    PublicIssue:
      type: object
      properties:
        identifier: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        status_info: { $ref: "#/components/schemas/StatusInfo" }
        priority: { type: integer }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
        assignees:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              display_name: { type: string }
              avatar_url: { type: string, nullable: true }
        due_date: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScreenShare:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        started_by: { type: string, format: uuid }
        started_by_user:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            display_name: { type: string }
            avatar_url: { type: string, nullable: true }
        status: { type: string }
        viewer_count: { type: integer }
        created_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }

    CreateWebhookRequest:
      type: object
      required: [url, secret, events]
      properties:
        url: { type: string, format: uri }
        secret: { type: string, minLength: 8 }
        events: { type: array, minItems: 1, items: { type: string } }
    UpdateWebhookRequest:
      type: object
      properties:
        url: { type: string, format: uri }
        events: { type: array, items: { type: string } }
        is_active: { type: boolean }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        events: { type: array, items: { type: string } }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AISettings:
      type: object
      properties:
        provider: { type: string, enum: [openai_compatible] }
        base_url: { type: string, format: uri }
        model: { type: string }
        has_api_key: { type: boolean, description: The key itself is never returned. }
        description_expand_prompt: { type: string }
        default_prompt: { type: string }
        issue_copy_prompt: { type: string }
        default_issue_copy_prompt: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpdateAISettingsRequest:
      type: object
      properties:
        provider: { type: string, enum: [openai_compatible] }
        base_url: { type: string, maxLength: 500 }
        model: { type: string, maxLength: 200 }
        api_key: { type: string, nullable: true }
        description_expand_prompt: { type: string, maxLength: 4000 }
        issue_copy_prompt: { type: string, maxLength: 8000 }

    ForgejoStatus:
      type: object
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        global_config: { type: boolean }
        instance_url: { type: string }
        account:
          type: object
          nullable: true
          properties:
            login: { type: string }
            avatar_url: { type: string }
        repos: { type: array, items: { $ref: "#/components/schemas/ForgejoRepo" } }
    ForgejoRepo:
      type: object
      properties:
        id: { type: string, format: uuid }
        forgejo_repo_id: { type: integer, format: int64 }
        full_name: { type: string }
        instance_url: { type: string }
        default_branch: { type: string }
        is_active: { type: boolean }
    ForgejoUserMapping:
      type: object
      properties:
        forgejo_login: { type: string }
        user_id: { type: string, format: uuid }
    ForgejoAutoTransition:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [branch_created, pr_opened, checks_green, pr_merged]
        target_status: { type: string, description: Status slug; rejected with 400 INVALID_STATUS when unknown. }
        target_status_id: { type: string, format: uuid, nullable: true }
        target_assignee_id: { type: string, format: uuid, nullable: true }
        assign_forgejo_user: { type: boolean, description: Additive — adds the mapped Forgejo user to the assignee set. }
        is_active: { type: boolean }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        issue_id: { type: string, format: uuid, nullable: true }
        issue_identifier: { type: string, nullable: true }
        type: { type: string }
        title: { type: string }
        read_at: { type: string, format: date-time, nullable: true }
        snoozed_until: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    UpdateNotificationRequest:
      type: object
      properties:
        read_at: { type: string, format: date-time, nullable: true }
        snoozed_until: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        read_only: { type: boolean, default: false }
        expires_in_days: { type: integer, minimum: 1, maximum: 3650, nullable: true }
    APIKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string, example: ku_9f2A }
        scopes: { type: array, items: { type: string, enum: [read, write] } }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    AvatarUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PNG/JPEG/GIF/WebP/AVIF/BMP/SVG, ≤5 MB (magic-byte sniffed).
    FileUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    ImportUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Workspace export archive produced by the export endpoint.
