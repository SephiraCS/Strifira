  /api/workspaces/{slug}/issues/{identifier}/expand-description:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Identifier"
    post:
      operationId: expandIssueDescription
      tags: [AI]
      summary: AI-expand an issue description
      description: |
        Requires: issue:update. Uses the workspace AI settings
        (OpenAI-compatible provider). Returns a suggestion; it is not saved
        to the issue. `AI_NOT_CONFIGURED` (400) when the workspace has no
        AI settings.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                selected_text:
                  type: string
                  maxLength: 8000
                  description: Rework only this selection instead of the whole description.
      responses:
        "200":
          description: Suggested description HTML fragment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  description: { type: string }

