  /mcp:
    post:
      operationId: mcp
      tags: [MCP]
      summary: MCP endpoint (streamable HTTP, stateless)
      description: |
        Model Context Protocol over stateless streamable HTTP. Every POST
        is a self-contained JSON-RPC 2.0 message (`initialize`,
        `tools/list`, `tools/call`); `Mcp-Session-Id` is ignored.
        Authenticate with a personal API key (`Bearer ku_...`); tools run
        with the key owner's identity and the same workspace RBAC as the
        UI. Read-only keys are limited to query tools. 44 tools cover the
        full ticketing surface (workspaces, teams, states, projects,
        labels, issues, comments, cycles, notifications, analytics,
        Forgejo). Friendly references everywhere: teams by key/name/id,
        users by email/name/id, issues by identifier/id.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: JSON-RPC result (or SSE stream for notifications-heavy calls).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Session access token (15-minute JWT). The browser uses the
        HttpOnly `access_token` cookie; programmatic clients send
        `Authorization: Bearer <access_token>` with the token from
        POST /api/auth/login.
    apiKeyAuth:
      type: http
      scheme: bearer
      description: Personal API key (`ku_...`) from Settings → Personal → API Keys. MCP endpoint only.
    machineToken:
      type: http
      scheme: bearer
      description: Dev-machine ingest token issued when the machine is created. Internal.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Workspace slug.
      schema: { type: string }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatusId:
      name: statusId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CycleId:
      name: cycleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Identifier:
      name: identifier
      in: path
      required: true
      description: Human issue identifier, e.g. ENG-12.
      schema: { type: string, pattern: "^[A-Z]+-\\d+$" }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RelationId:
      name: relationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareToken:
      name: token
      in: path
      required: true
      schema: { type: string }
    MachineId:
      name: machineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentRunId:
      name: agentRunId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceName:
      name: service
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    Ok:
      description: Success (opaque payload).
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    ValidationError:
      description: Invalid input (`VALIDATION_ERROR` with field details).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid credentials (`UNAUTHORIZED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Authenticated but not permitted (`FORBIDDEN`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource does not exist (`NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Too many requests (machine ingest limits).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorDetail:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string }
            details:
              type: array
              items: { $ref: "#/components/schemas/ErrorDetail" }
    PaginationMeta:
      type: object
      properties:
        total_count: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
        has_more: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
    RegisterRequest:
      allOf:
        - $ref: "#/components/schemas/LoginRequest"
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        expires_in: { type: integer, description: Seconds until the access token expires (900). }
    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        display_name: { type: string, maxLength: 100, nullable: true }
        avatar_url: { type: string, nullable: true }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        is_sysadmin: { type: boolean }

    UserPreferences:
      type: object
      properties:
        font_size: { type: string, enum: [small, default, large] }
        pointer_cursors: { type: boolean }
        theme_mode: { type: string, enum: [system, light, dark] }
        light_theme: { type: string }
        dark_theme: { type: string }
        workflow_sort_mode: { type: string, enum: [default, active-first, custom] }
        workflow_sort_order: { type: array, items: { type: string } }
        team_workflow_sort_overrides:
          type: object
          additionalProperties:
            type: object
            properties:
              mode: { type: string }
              workflow_sort_order: { type: array, items: { type: string } }
        recent_due_dates: { type: array, items: { type: string } }
        issues_group_by: { type: string, enum: [status, priority, assignee, project, none] }
        default_view_layout: { type: string, enum: [list, board] }
    UpdatePreferencesRequest:
      type: object
      description: Partial update; send only the keys to change.
      minProperties: 1
      additionalProperties: true

    CreateWorkspaceRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, minLength: 1, maxLength: 50, pattern: "^[a-z0-9-]+$" }
    UpdateWorkspaceRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        logo_url: { type: string, nullable: true }
        share_link_min_role: { type: string, enum: [owner, admin, member] }
        auto_archive_done_issues: { type: boolean }
    Workspace:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: string, nullable: true }
        owner_id: { type: string, format: uuid }
        owner:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            name: { type: string }
            avatar_url: { type: string, nullable: true }
        share_link_min_role: { type: string }
        auto_archive_done_issues: { type: boolean }
        current_user_role: { type: string, enum: [owner, admin, member, guest] }
        screen_sharing_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member, guest] }
    WorkspaceMember:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url: { type: string, nullable: true }
        role: { type: string, enum: [owner, admin, member, guest] }
        created_at: { type: string, format: date-time }

    CreateTeamRequest:
      type: object
      required: [name, key]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        key: { type: string, minLength: 1, maxLength: 10, pattern: "^[A-Z]+$" }
        description: { type: string, nullable: true }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
    UpdateTeamRequest:
      type: object
      description: Changing `key` rewrites every issue identifier in one transaction.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        key: { type: string, minLength: 1, maxLength: 10, pattern: "^[A-Z]+$" }
        description: { type: string, nullable: true }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        triage_enabled: { type: boolean }
        parent_auto_close_enabled: { type: boolean }
        sub_issue_auto_close_enabled: { type: boolean }
        issue_copy_prompt: { type: string, maxLength: 8000 }
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key: { type: string }
        description: { type: string, nullable: true }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        triage_enabled: { type: boolean }
        parent_auto_close_enabled: { type: boolean }
        sub_issue_auto_close_enabled: { type: boolean }
        issue_copy_prompt: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateTeamStatusRequest:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        category: { type: string, enum: [backlog, unstarted, started, completed, cancelled] }
        color: { type: string, nullable: true }
        project_ids: { type: array, items: { type: string, format: uuid } }
    UpdateTeamStatusRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        color: { type: string, nullable: true }
        position: { type: integer, minimum: 0 }
        project_ids: { type: array, items: { type: string, format: uuid } }
    TeamStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { type: string, enum: [backlog, unstarted, started, completed, cancelled] }
        color: { type: string, nullable: true }
        position: { type: integer }
        is_default: { type: boolean }
        project_ids: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        team_id: { type: string, format: uuid, nullable: true }
        lead_id: { type: string, format: uuid, nullable: true }
        start_date: { type: string, nullable: true }
        target_date: { type: string, nullable: true }
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        status: { type: string, enum: [planned, in_progress, completed, cancelled] }
        team_id: { type: string, format: uuid, nullable: true }
        lead_id: { type: string, format: uuid, nullable: true }
        start_date: { type: string, nullable: true }
        target_date: { type: string, nullable: true }
        sort_order: { type: number }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [planned, in_progress, completed, cancelled] }
        team_id: { type: string, format: uuid, nullable: true }
        lead_id: { type: string, format: uuid, nullable: true }
        start_date: { type: string, format: date-time, nullable: true }
        target_date: { type: string, format: date-time, nullable: true }
        sort_order: { type: number }
        progress:
          type: object
          nullable: true
          properties:
            total: { type: integer }
            completed: { type: integer }
            cancelled: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCycleRequest:
      type: object
      required: [name, start_date, end_date]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true }
        goals: { type: string, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    UpdateCycleRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        goals: { type: string, nullable: true }
        retrospective: { type: string, nullable: true }
        status: { type: string, enum: [upcoming, active, completed] }
        start_date: { type: string, nullable: true }
        end_date: { type: string, nullable: true }
    CompleteCycleRequest:
      type: object
      properties:
        retrospective: { type: string, nullable: true }
        carry_over: { type: boolean, default: false }
    Cycle:
      type: object
      properties:
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        name: { type: string }
        number: { type: integer }
        status: { type: string, enum: [upcoming, active, completed] }
        description: { type: string, nullable: true }
        goals: { type: string, nullable: true }
        retrospective: { type: string, nullable: true }
        start_date: { type: string, format: date-time, nullable: true }
        end_date: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        progress:
          type: object
          nullable: true
          properties:
            total: { type: integer }
            completed: { type: integer }
            cancelled: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BurndownPoint:
      type: object
      properties:
        date: { type: string, format: date }
        scope: { type: integer }
        started: { type: integer }
        completed: { type: integer }
    VelocityPoint:
      type: object
      properties:
        cycle_id: { type: string, format: uuid }
        cycle_name: { type: string }
        cycle_number: { type: integer }
        scope: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        start_date: { type: string, format: date-time, nullable: true }
        end_date: { type: string, format: date-time, nullable: true }

    IssueStatus:
      type: string
      description: Default state when no custom status_id is set.
      enum: [backlog, todo, in_progress, in_review, done, cancelled]
    CreateIssueRequest:
      type: object
      required: [title, team_id]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/IssueStatus" }
        status_id: { type: string, format: uuid }
        priority: { type: integer, minimum: 0, maximum: 4 }
        team_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        assignee_id: { type: string, format: uuid, nullable: true }
        assignee_ids: { type: array, items: { type: string, format: uuid } }
        label_ids: { type: array, items: { type: string, format: uuid } }
        parent_id: { type: string, format: uuid, nullable: true }
        due_date: { type: string, nullable: true }
        cycle_id: { type: string, format: uuid, nullable: true }
    CreateSubIssueRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/IssueStatus" }
        status_id: { type: string, format: uuid }
        priority: { type: integer, minimum: 0, maximum: 4 }
        project_id: { type: string, format: uuid, nullable: true }
        assignee_id: { type: string, format: uuid, nullable: true }
        assignee_ids: { type: array, items: { type: string, format: uuid } }
        label_ids: { type: array, items: { type: string, format: uuid } }
        due_date: { type: string, nullable: true }
        cycle_id: { type: string, format: uuid, nullable: true }
    UpdateIssueRequest:
      type: object
      description: Partial update; `sort_order` matters for board ordering.
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/IssueStatus" }
        status_id: { type: string, format: uuid }
        priority: { type: integer, minimum: 0, maximum: 4 }
        assignee_id: { type: string, format: uuid, nullable: true }
        assignee_ids: { type: array, items: { type: string, format: uuid } }
        project_id: { type: string, format: uuid, nullable: true }
        cycle_id: { type: string, format: uuid, nullable: true }
        label_ids: { type: array, items: { type: string, format: uuid } }
        parent_id: { type: string, format: uuid, nullable: true }
        due_date: { type: string, nullable: true }
        sort_order: { type: number }
    BulkUpdateIssuesRequest:
      type: object
      required: [issue_ids]
      properties:
        issue_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/IssueStatus" }
        status_id: { type: string, format: uuid }
        priority: { type: integer, minimum: 0, maximum: 4 }
        assignee_id: { type: string, format: uuid, nullable: true }
        label_ids: { type: array, items: { type: string, format: uuid } }
        cycle_id: { type: string, format: uuid, nullable: true }
        parent_id: { type: string, format: uuid, nullable: true }
        archived: { type: boolean }
    StatusInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        color: { type: string, nullable: true }
        position: { type: integer }
    IssueSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        status_id: { type: string, format: uuid }
        status_info: { $ref: "#/components/schemas/StatusInfo" }
        priority: { type: integer }
        assignee: { $ref: "#/components/schemas/User" }
    Issue:
      type: object
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string, example: ENG-12 }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        status_id: { type: string, format: uuid }
        status_info: { $ref: "#/components/schemas/StatusInfo" }
        priority: { type: integer, description: "0 none, 1 urgent, 2 high, 3 medium, 4 low." }
        team_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid, nullable: true }
        cycle_id: { type: string, format: uuid, nullable: true }
        creator_id: { type: string, format: uuid }
        assignee_id: { type: string, format: uuid, nullable: true }
        parent_id: { type: string, format: uuid, nullable: true }
        due_date: { type: string, format: date-time, nullable: true }
        sort_order: { type: number }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
