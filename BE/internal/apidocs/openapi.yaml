      - result
      properties:
        lease_token: {type: string, pattern: '^sfl_[0-9a-f]{64}$', description: Separate per-job lease token returned by claim;
            never the registration token.}
        result: {$ref: '#/components/schemas/DevBoxCompletionResult'}

