          properties:
            related: { type: integer }
            blocked_by: { type: integer }
            blocking: { type: integer }
            duplicate: { type: integer }
        relation_summary:
          type: object
          properties:
            related: { type: array, items: { $ref: "#/components/schemas/IssueSummary" } }
            blocked_by: { type: array, items: { $ref: "#/components/schemas/IssueSummary" } }
            blocking: { type: array, items: { $ref: "#/components/schemas/IssueSummary" } }
            duplicate: { type: array, items: { $ref: "#/components/schemas/IssueSummary" } }
        is_subscribed: { type: boolean }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1 }
        parent_id: { type: string, format: uuid, nullable: true }
    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        issue_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        body: { type: string }
        parent_id: { type: string, format: uuid, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        user: { $ref: "#/components/schemas/User" }
        replies: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRelationRequest:
      type: object
      required: [related_identifier, type]
      properties:
        related_identifier: { type: string, example: ENG-14 }
        type: { type: string, enum: [related, blocked_by, blocking, duplicate] }
    IssueRelation:
      type: object
      properties:
        id: { type: string, format: uuid }
        issue_id: { type: string, format: uuid }
        related_issue_id: { type: string, format: uuid }
        type: { type: string, enum: [related, blocked_by, blocking, duplicate] }
        related_issue: { $ref: "#/components/schemas/Issue" }
        created_at: { type: string, format: date-time }

    CreateIssueTemplateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/IssueStatus" }
        priority: { type: integer, minimum: 0, maximum: 4, nullable: true }
        team_id: { type: string, format: uuid, nullable: true }
        assignee_id: { type: string, format: uuid, nullable: true }
        label_ids: { type: array, items: { type: string, format: uuid } }
        recurrence_rule:
          type: object
          nullable: true
