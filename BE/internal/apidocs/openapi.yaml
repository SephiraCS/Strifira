# Strifira REST API — OpenAPI 3.1 description.
#
# Single source of truth for the HTTP surface registered in
# cmd/server/main.go. Served same-origin at /api/openapi.json and browsed
# through the Scalar page at /docs. The parity test in this package fails
# when a route is registered in main.go without an entry here (or vice
# versa), so extend this file in the same change as any route addition.
openapi: 3.1.0

info:
  title: Strifira API
  version: 0.3.43
  summary: Issue tracker REST API behind strifira.mariogk.com
  description: |
    Strifira is a Linear-style issue tracker. This document describes the REST API
    served by the Go backend under `/api` (plus `/health`, `/ready`, `/mcp`,
    and the public share/avatar paths), as deployed at
    [strifira.mariogk.com](https://strifira.mariogk.com/).

    ## Authentication

    Most routes require a JWT. The web UI authenticates with rotating
    HttpOnly cookies (`access_token`, 15 minutes, and `refresh_token`);
    programmatic clients send `Authorization: Bearer <access_token>` where
    the token comes from `POST /api/auth/login`. Refresh-token rotation is
    race-tolerant (30-second grace window for contexts sharing one cookie
    jar).

    The MCP endpoint is different: it authenticates with a **personal API
    key** (`Authorization: Bearer strifira_...`) created under
    Settings → Personal → API Keys.

    Dev-box workers authenticate with a dedicated **registration token**
    (`Authorization: Bearer sfw_...`) on `/api/dev-box-worker` only. These
    tokens carry no personal API/MCP access. Job mutations also require a
    separate expiring lease token in the request body.

    ## Authorization

    Routes under `/api/workspaces/{slug}` require membership of that
    workspace and enforce role permissions per call. Roles: `owner`,
    `admin`, `member`, `guest` (guests get read-only surfaces). Permission
    requirements are noted per operation (e.g. `team:manage`).

    ## Conventions

    * Errors use `{"error": {"code": "...", "message": "...", "details": [...]}}`.
    * Paginated lists return `{data, total_count, page, per_page, has_more}`
      (up to 100 items per page); other lists return plain arrays.
    * Issues are referenced by their human identifier (`ENG-12`) or UUID.
    * Workspace entities (teams, labels, projects, cycles…) are UUID-keyed.
    * Live updates ride the workspace WebSocket `/api/workspaces/{slug}/ws`.
  license:
    name: Fork of SephiraCS/Strifira
    url: https://github.com/SephiraCS/Strifira

# No servers entry: the document is served same-origin, so clients explore
# against whichever origin they loaded it from.

tags:
  - name: Auth
    description: "Registration, login, token refresh, logout, and the current user."
  - name: Preferences
    description: "Per-user UI preferences (theme, workflow sort, default view layout)."
  - name: System
    description: "Self-update status and trigger (sysadmin)."
  - name: API Keys
    description: "Personal API keys used for the MCP endpoint. Keys are shown once at creation."
  - name: Notifications
    description: "User-scoped inbox notifications (issue mentions, assignments, ...)."
  - name: Workspaces
    description: "Workspace list, creation, and import/export. Workspace-scoped routes live under /api/workspaces/{slug} and require membership."
  - name: Members
    description: "Workspace membership: invites, roles, removal."
  - name: Teams
    description: "Teams group issues; the team key prefixes issue identifiers (ENG-12)."
  - name: Team Statuses
    description: "Per-team workflow states (custom kanban columns), each in a category."
  - name: Projects
    description: "Projects optionally attach to a team and roll up issue progress."
  - name: Cycles
    description: "Time-boxed iterations per team with burndown and velocity analytics."
  - name: Issues
    description: "Issue CRUD, bulk operations, archive, subscribe, duplicate, triage, history."
  - name: Comments
    description: "Threaded issue comments with resolve/reopen."
  - name: Relations
    description: "Issue relations: related / blocked_by / blocking / duplicate."
  - name: Issue Templates
    description: "Recurring issue templates that spawn issues on a schedule."
  - name: Labels
    description: "Workspace labels with colors and optional parent hierarchy."
  - name: Views
    description: "Saved per-user (or shared) issue filter views."
  - name: Favorites
    description: "Sidebar favorites pinning projects, views, teams, cycles, labels."
  - name: Shared Links
    description: "Public read-only share links for a scope (workspace/team/project/view)."
  - name: Public Shares
    description: "Unauthenticated surfaces consumed by public share pages."
  - name: Screen Shares
    description: "P2P WebRTC screen-share sessions signaled over the workspace WebSocket."
  - name: Analytics
    description: "Workspace analytics: overview, distribution, insights, burnup."
  - name: Webhooks
    description: "Outgoing workspace webhooks (generic events)."
  - name: AI
    description: "Workspace AI settings and text rework endpoints (OpenAI-compatible providers)."
  - name: GitHub
    description: "GitHub integration: connection, repo linking, user mappings, automation rules, Actions runs/jobs/logs, and the inbound webhook."
  - name: Dev Machines
    description: "Ephemeral development machines (agent/IDE host integration). Guarded by dev_machine:* permissions."
  - name: Dev Boxes
    description: "Creator-scoped outbound development workers and issue jobs, with dedicated tokens and expiring leases."
  - name: Uploads
    description: "Issue attachment uploads and asset delivery."
  - name: Avatars
    description: "Public user and workspace avatar images."
  - name: Realtime
    description: "Workspace WebSocket for live updates and screen-share signaling."
  - name: MCP
    description: "Model Context Protocol endpoint (44 tools, full UI parity) for agents."
  - name: Health
    description: "Liveness and readiness probes."

security:
  - jwtAuth: []

paths:
  /health:
    get:
      operationId: health
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up (checks a database round-trip).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /ready:
    get:
      operationId: ready
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Service is ready to serve traffic.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /metrics:
    get:
      operationId: metrics
      tags: [Health]
      summary: Prometheus metrics
      description: Prometheus exposition of HTTP request counts and latency by route template, GitHub webhook delivery outcomes and Go runtime metrics. Intended for in-cluster scraping only; the bundled reverse proxies do not route it publicly.
      security: []
      responses:
        "200":
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string

  /api/openapi.json:
    get:
      operationId: openapiSpec
      tags: [Health]
      summary: This OpenAPI document
      description: The machine-readable description of every route in this file, served same-origin. Browse it through the Scalar page at /docs.
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/docs:
    get:
      operationId: apiDocsRedirect
      tags: [Health]
      summary: Redirect to the API docs page
      description: Convenience redirect to the Scalar reference page served by the SPA at /docs.
      security: []
      responses:
        "302":
          description: Redirect to /docs.

  /api/auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Register an account
      description: |
        Creates a user and starts a session (sets auth cookies). The first
        registered account owns the instance; later registrations can be
        disabled by closing the workspace. Passwords must be 12–128 chars.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; auth cookies set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Email already registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in
      description: |
        Exchange email + password for a 15-minute access token. The response
        sets `access_token` and rotating `refresh_token` HttpOnly cookies;
        the same access token is returned in the body for programmatic
        clients. No IP-based rate limiting by operator directive (shared
        egress IPs); instead, repeated failed logins for one email lock that
        email for 15 minutes (429 with `Retry-After`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; cookies set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/auth/refresh:
    post:
      operationId: refresh
      tags: [Auth]
      summary: Rotate the session
      description: |
        Consumes the `refresh_token` cookie and issues a fresh access token
        + refresh cookie. Rotation is atomic with a 30-second grace window,
        so contexts sharing one cookie jar can race safely; replays beyond
        grace are rejected and clear the cookies.
      security: []
      responses:
        "200":
          description: New tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Log out
      description: Deletes the refresh token for the presenting cookie jar and clears auth cookies.
      security: []
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/auth/me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Current user
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      operationId: updateProfile
      tags: [Auth]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /api/auth/me/avatar:
    post:
      operationId: uploadMyAvatar
      tags: [Avatars, Auth]
      summary: Upload the current user's avatar
      description: PNG/JPEG/GIF/WebP/AVIF/BMP/SVG up to 5 MB, magic-byte sniffed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AvatarUpload"
      responses:
        "200":
          description: Avatar stored; `avatar_url` points at `/api/avatars/{userId}`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      operationId: removeMyAvatar
      tags: [Avatars, Auth]
      summary: Remove the current user's avatar
      responses:
        "200":
          description: Avatar removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /api/preferences:
    get:
      operationId: getPreferences
      tags: [Preferences]
      summary: Get UI preferences
      responses:
        "200":
          description: Stored preferences (with defaults applied).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
    patch:
      operationId: updatePreferences
      tags: [Preferences]
      summary: Update UI preferences
      description: Partial update; omitted keys keep their stored values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePreferencesRequest" }
      responses:
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }

  /api/system/update-status:
    get:
      operationId: systemUpdateStatus
      tags: [System]
      summary: Self-update status
      responses:
        "200":
          description: Updater status payload.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/system/update:
    post:
      operationId: systemStartUpdate
      tags: [System]
      summary: Trigger a self-update
      description: Sysadmin-only; asks the configured updater service to start.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/workspaces:
    get:
      operationId: listWorkspaces
      tags: [Workspaces]
      summary: List my workspaces
      responses:
        "200":
          description: Workspaces the caller belongs to.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
    post:
      operationId: createWorkspace
      tags: [Workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceRequest" }
      responses:
        "201":
          description: Created workspace; creator becomes owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "409":
          description: Slug already taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/workspaces/import/preview:
    post:
      operationId: previewWorkspaceImport
      tags: [Workspaces]
      summary: Preview a workspace import
      description: Parses an export archive and reports what would be imported.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUpload"
      responses:
        "200":
          description: Import preview summary.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/workspaces/import:
    post:
      operationId: importWorkspace
      tags: [Workspaces]
      summary: Import a workspace
      description: Imports an export archive as a new workspace.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUpload"
      responses:
        "201":
          description: Import result summary.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/workspaces/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getWorkspace
      tags: [Workspaces]
      summary: Get a workspace
      responses:
        "200":
          description: Workspace with the caller's role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWorkspace
      tags: [Workspaces]
      summary: Update a workspace
      description: "Requires: owner."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspaceRequest" }
      responses:
        "200":
          description: Updated workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
    delete:
      operationId: deleteWorkspace
      tags: [Workspaces]
      summary: Delete a workspace
      description: "Requires: owner. Irreversible; deletes all contained data."
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/avatar:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: uploadWorkspaceAvatar
      tags: [Avatars, Workspaces]
      summary: Upload the workspace logo
      description: "Requires: owner. Same image rules as user avatars."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AvatarUpload"
      responses:
        "200":
          description: Updated workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
    delete:
      operationId: removeWorkspaceAvatar
      tags: [Avatars, Workspaces]
      summary: Remove the workspace logo
      description: "Requires: owner."
      responses:
        "200":
          description: Updated workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }

  /api/workspaces/{slug}/export:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: exportWorkspace
      tags: [Workspaces]
      summary: Export a workspace
      description: "Requires: workspace transfer permission. Returns a downloadable export archive."
      responses:
        "200":
          description: Export archive.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /api/workspaces/{slug}/invite:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: inviteMember
      tags: [Members]
      summary: Invite a member
      description: "Requires: member:invite."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteMemberRequest" }
      responses:
        "201":
          description: Membership created (existing user) or invite recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMember" }

  /api/workspaces/{slug}/members:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listMembers
      tags: [Members]
      summary: List members
      responses:
        "200":
          description: Workspace members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceMember" }

  /api/workspaces/{slug}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateMemberRole
      tags: [Members]
      summary: Change a member's role
      description: "Requires: member:invite. Only the owner can promote to owner."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [owner, admin, member, guest]
      responses:
        "200":
          description: Updated membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceMember" }
    delete:
      operationId: removeMember
      tags: [Members]
      summary: Remove a member
      description: "Requires: member:invite."
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/teams:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listTeams
      tags: [Teams]
      summary: List teams
      responses:
        "200":
          description: Teams in the workspace.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
    post:
      operationId: createTeam
      tags: [Teams]
      summary: Create a team
      description: "Requires: team:manage. The key (1–10 uppercase letters) prefixes issue identifiers."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: Created team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }

  /api/workspaces/{slug}/teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: getTeam
      tags: [Teams]
      summary: Get a team
      responses:
        "200":
          description: Team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateTeam
      tags: [Teams]
      summary: Update a team (or rename its key)
      description: |
        Requires: team:manage. Changing `key` rewrites every issue
        identifier (ENG-12 → NEW-12) in one transaction; a collision with
        another team's key rejects with `409 TEAM_KEY_COLLISION` and changes
        nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTeamRequest" }
      responses:
        "200":
          description: Updated team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "409":
          description: TEAM_KEY_COLLISION — another team already issues identifiers under the new key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteTeam
      tags: [Teams]
      summary: Delete a team
      description: "Requires: team:manage."
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/teams/{teamId}/leave:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/TeamId"
    post:
      operationId: leaveTeam
      tags: [Teams]
      summary: Leave a team
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/teams/{teamId}/statuses:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: listTeamStates
      tags: [Team Statuses]
      summary: List workflow states
      responses:
        "200":
          description: Ordered workflow states for the team.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamStatus" }
    post:
      operationId: createTeamState
      tags: [Team Statuses]
      summary: Create a workflow state
      description: "Requires: team:manage. Category drives kanban grouping."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamStatusRequest" }
      responses:
        "201":
          description: Created state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamStatus" }

  /api/workspaces/{slug}/teams/{teamId}/statuses/{statusId}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/StatusId"
    patch:
      operationId: updateTeamState
      tags: [Team Statuses]
      summary: Update a workflow state
      description: "Requires: team:manage."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTeamStatusRequest" }
      responses:
        "200":
          description: Updated state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamStatus" }
    delete:
      operationId: deleteTeamState
      tags: [Team Statuses]
      summary: Delete a workflow state
      description: "Requires: team:manage. Issues on it move to the default state."
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/teams/{teamId}/cycles:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: listCycles
      tags: [Cycles]
      summary: List cycles
      responses:
        "200":
          description: Cycles for the team.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Cycle" }
    post:
      operationId: createCycle
      tags: [Cycles]
      summary: Create a cycle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCycleRequest" }
      responses:
        "201":
          description: Created cycle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cycle" }

  /api/workspaces/{slug}/teams/{teamId}/cycles/velocity:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: cycleVelocity
      tags: [Cycles]
      summary: Cycle velocity history
      responses:
        "200":
          description: Completed/cancelled counts per cycle.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VelocityPoint" }

  /api/workspaces/{slug}/teams/{teamId}/cycles/{cycleId}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/CycleId"
    get:
      operationId: getCycle
      tags: [Cycles]
      summary: Get a cycle
      responses:
        "200":
          description: Cycle with progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cycle" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCycle
      tags: [Cycles]
      summary: Update a cycle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCycleRequest" }
      responses:
        "200":
          description: Updated cycle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cycle" }
    delete:
      operationId: deleteCycle
      tags: [Cycles]
      summary: Delete a cycle
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/teams/{teamId}/cycles/{cycleId}/complete:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/CycleId"
    post:
      operationId: completeCycle
      tags: [Cycles]
      summary: Complete a cycle
      description: Optionally carries unfinished issues into the next cycle.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteCycleRequest" }
      responses:
        "200":
          description: Completed cycle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cycle" }

  /api/workspaces/{slug}/teams/{teamId}/cycles/{cycleId}/burndown:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/CycleId"
    get:
      operationId: cycleBurndown
      tags: [Cycles]
      summary: Cycle burndown series
      responses:
        "200":
          description: Daily scope/started/completed points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BurndownPoint" }

  /api/workspaces/{slug}/issues:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listIssues
      tags: [Issues]
      summary: List issues
      description: |
        Paginated (default 50, max 100 per page). Boards that need every
        issue follow all pages. Filters combine with AND.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - { name: status, in: query, schema: { type: string }, description: "Default state filter (backlog/todo/in_progress/in_review/done/canceled)." }
        - { name: status_type, in: query, schema: { type: string }, description: "State category (backlog/unstarted/started/completed/cancelled)." }
        - { name: status_id, in: query, schema: { type: string, format: uuid }, description: Exact workflow state id." }
        - { name: archived, in: query, schema: { type: string, enum: ["true", "false"] }, description: "Filter by archived flag." }
        - { name: priority, in: query, schema: { type: string }, description: "0–4 (none/urgent/high/medium/low)." }
        - { name: assignee, in: query, schema: { type: string, format: uuid }, description: "Assignee user id." }
        - { name: creator, in: query, schema: { type: string, format: uuid }, description: "Creator user id." }
        - { name: team, in: query, schema: { type: string, format: uuid }, description: "Team id." }
        - { name: project, in: query, schema: { type: string, format: uuid }, description: "Project id." }
        - { name: cycle, in: query, schema: { type: string, format: uuid }, description: "Cycle id." }
        - { name: label, in: query, schema: { type: string, format: uuid }, description: "Label id." }
        - { name: search, in: query, schema: { type: string }, description: "Title/description substring." }
        - { name: due_before, in: query, schema: { type: string, format: date }, description: "Due date upper bound." }
        - { name: due_after, in: query, schema: { type: string, format: date }, description: "Due date lower bound." }
        - { name: triaged, in: query, schema: { type: string }, description: "Triage filter for triage-enabled teams." }
        - { name: sub_issues, in: query, schema: { type: string }, description: "Sub-issue filter." }
        - { name: parent_id, in: query, schema: { type: string, format: uuid }, description: "Parent issue id." }
        - { name: group_by, in: query, schema: { type: string, enum: [status, priority, assignee, project] } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, updated_at, priority, sort_order, status, due_date] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200":
          description: Paginated issues.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Issue" }
    post:
      operationId: createIssue
      tags: [Issues]
      summary: Create an issue
      description: "Requires: issue:create. Status defaults to the team's default state."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIssueRequest" }
      responses:
        "201":
          description: Created issue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/workspaces/{slug}/issues/bulk:
    parameters:
      - $ref: "#/components/parameters/Slug"
    patch:
      operationId: bulkUpdateIssues
      tags: [Issues]
      summary: Bulk update issues
      description: |
        Requires: issue:update. Mirrors single-issue semantics per issue:
        completed-category guard skips concurrently reopened issues,
        archiving clears `auto_archive_exempt`. Broadcasts
        `issues.bulk_updated` over the workspace WebSocket.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkUpdateIssuesRequest" }
      responses:
        "200":
          description: Update result (updated issue ids and counts).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    delete:
      operationId: bulkDeleteIssues
      tags: [Issues]
      summary: Bulk delete issues
      description: "Requires: issue:delete_own."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issue_ids]
              properties:
                issue_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/issues/{identifier}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Identifier"
    get:
      operationId: getIssue
      tags: [Issues]
      summary: Get an issue
      description: Returns labels, creator, assignees, relation counts, and sub-issue tallies.
      responses:
        "200":
          description: Issue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateIssue
      tags: [Issues]
      summary: Update an issue
      description: |
        Requires: issue:update. Status changes fail closed with
        `400 INVALID_STATUS` on unknown or cross-team state ids. Send
        `sort_order` when moving cards to keep ordering stable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIssueRequest" }
      responses:
        "200":
          description: Updated issue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
    delete:
      operationId: deleteIssue
      tags: [Issues]
      summary: Delete an issue
      description: "Requires: issue:delete_own."
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/issues/{identifier}/archive:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Identifier"
    post:
      operationId: archiveIssue
      tags: [Issues]
      summary: Archive an issue
      description: "Requires: issue:update. Only completed-category issues can be archived; clears `auto_archive_exempt`."
      responses:
        "200":
          description: Archived issue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
    delete:
      operationId: unarchiveIssue
