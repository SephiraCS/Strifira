            schema: { $ref: "#/components/schemas/CreateFavoriteRequest" }
      responses:
        "201":
          description: Created favorite.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Favorite" }

  /api/workspaces/{slug}/favorites/{id}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deleteFavorite
      tags: [Favorites]
      summary: Remove a favorite
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/shared-links:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listSharedLinks
      tags: [Shared Links]
      summary: List share links
      responses:
        "200":
          description: Share links for the workspace.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SharedLink" }
    post:
      operationId: createSharedLink
      tags: [Shared Links]
      summary: Create a share link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSharedLinkRequest" }
      responses:
        "201":
          description: Created share link (includes the public token).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedLink" }

  /api/workspaces/{slug}/shared-links/{id}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateSharedLink
      tags: [Shared Links]
      summary: Update a share link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSharedLinkRequest" }
      responses:
        "200":
          description: Updated share link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedLink" }
    delete:
      operationId: deleteSharedLink
      tags: [Shared Links]
      summary: Delete a share link
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/public/share/{token}:
    get:
      operationId: getPublicShareMeta
      tags: [Public Shares]
      summary: Public share metadata
      description: Unauthenticated scope metadata for a share link (workspace name, statuses, filters).
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Share metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicShareMeta" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/share/{token}/issues:
    get:
      operationId: listPublicShareIssues
      tags: [Public Shares]
      summary: Public share issues
      description: Read-only issue list behind a share link; descriptions included only when the link allows it.
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Issues visible through the link.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicIssue" }

  /api/public/assets/{token}:
    get:
      operationId: getPublicAsset
      tags: [Uploads, Public Shares]
      summary: Public asset by signed token
      security: []
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: Asset bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /api/avatars/{userId}:
    get:
      operationId: getUserAvatar
      tags: [Avatars]
      summary: User avatar image
      description: Public so avatars render on share pages; SVG responses carry a restrictive CSP. Supports `?v=` cache busting.
      security: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Image bytes.
          content:
            image/*:
              schema: { type: string, format: binary }

  /api/workspace-avatars/{workspaceId}:
    get:
      operationId: getWorkspaceAvatar
      tags: [Avatars]
      summary: Workspace logo image
      security: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Image bytes.
          content:
            image/*:
              schema: { type: string, format: binary }

  /api/workspaces/{slug}/shares:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listScreenShares
      tags: [Screen Shares]
      summary: List screen shares
      description: Active and recent P2P screen-share sessions.
      responses:
        "200":
          description: Active and recent shares.
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: array
                    items: { $ref: "#/components/schemas/ScreenShare" }
                  recent:
                    type: array
                    items: { $ref: "#/components/schemas/ScreenShare" }
    post:
      operationId: createScreenShare
      tags: [Screen Shares]
      summary: Start a screen share
      description: |
        Requires: share:create. Creates the share session; the presenter's
        browser then captures screen + tab audio and signals viewers
        peer-to-peer over the workspace WebSocket (`share.presence` /
        `share.signal`). Shares are restart-surviving and GC'd only after
        the presenter stops announcing presence.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Created share.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScreenShare" }

  /api/workspaces/{slug}/shares/{id}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getScreenShare
      tags: [Screen Shares]
      summary: Get a screen share
      responses:
        "200":
          description: Share session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScreenShare" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{slug}/shares/{id}/end:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: endScreenShare
      tags: [Screen Shares]
      summary: End a screen share
      description: Broadcasts `share.ended` so parked viewer walls update.
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/analytics/overview:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: analyticsOverview
      tags: [Analytics]
      summary: Workspace analytics overview
      responses:
        "200":
          description: Headline counts and trends.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/workspaces/{slug}/analytics/distribution:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: analyticsDistribution
      tags: [Analytics]
      summary: Issue distribution
      responses:
        "200":
          description: Breakdowns by status/priority/assignee/team.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/workspaces/{slug}/analytics/insights:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: analyticsInsights
      tags: [Analytics]
      summary: Workspace insights
      responses:
        "200":
          description: Derived insights (stale, untouched, overdue…).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/workspaces/{slug}/analytics/burnup:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: analyticsBurnup
      tags: [Analytics]
      summary: Workspace burnup series
      responses:
        "200":
          description: Time series of scope vs completion.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }

  /api/workspaces/{slug}/webhooks:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List webhooks
      description: "Requires: workspace:manage."
      responses:
        "200":
          description: Registered webhooks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Create a webhook
      description: "Requires: workspace:manage. Deliveries are signed with the secret (HMAC)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookRequest" }
      responses:
        "201":
          description: Created webhook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }

  /api/workspaces/{slug}/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateWebhook
      tags: [Webhooks]
      summary: Update a webhook
      description: "Requires: workspace:manage."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWebhookRequest" }
      responses:
        "200":
          description: Updated webhook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete a webhook
      description: "Requires: workspace:manage."
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/ai-settings:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getAISettings
      tags: [AI]
      summary: Get workspace AI settings
      description: "Readable by members (issue:read); never returns the stored key, only `has_api_key`."
      responses:
        "200":
          description: AI settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettings" }
    patch:
      operationId: updateAISettings
      tags: [AI]
      summary: Update workspace AI settings
      description: "Requires: owner. The API key is encrypted at rest and never read back."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAISettingsRequest" }
      responses:
        "200":
          description: Updated AI settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettings" }

  /api/workspaces/{slug}/ai-settings/issue-copy-prompt:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getIssueCopyPrompt
      tags: [AI]
      summary: Effective issue-copy prompt
      description: Returns the configured prompt plus the built-in default (issue:read).
      responses:
        "200":
          description: Prompt pair.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue_copy_prompt: { type: string }
                  default_issue_copy_prompt: { type: string }

  /api/workspaces/{slug}/ai/rework:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: reworkText
      tags: [AI]
      summary: Rework text with AI
      description: |
        Requires: issue:update. Workspace-scoped text rework used by
        comment editors and the create-issue dialog. Returns
        `AI_NOT_CONFIGURED` (400) when the workspace has no AI settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 8000 }
                context: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Reworked text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }

  /api/forgejo/webhook:
    post:
      operationId: forgejoWebhook
      tags: [Forgejo]
      summary: Inbound Forgejo webhook
      description: |
        Public endpoint called by Forgejo for `push`, `pull_request`,
        `create`, and Actions run-completion events. Every delivery must
        carry a valid `X-Forgejo-Signature` (HMAC of the shared secret ku
        generated when the repo was linked); invalid signatures are
        dropped.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/workspaces/{slug}/forgejo/status:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: forgejoStatus
      tags: [Forgejo]
      summary: Integration status
      description: Connection state, account, and linked repos.
      responses:
        "200":
          description: Status payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForgejoStatus" }

  /api/workspaces/{slug}/forgejo/connection:
    parameters:
      - $ref: "#/components/parameters/Slug"
    put:
      operationId: forgejoConnect
      tags: [Forgejo]
      summary: Connect a Forgejo token
      description: "Requires: workspace:manage. Per-workspace token connection (global mode preconfigures the instance)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instance_url, token]
              properties:
                instance_url: { type: string, format: uri }
                token: { type: string, minLength: 20 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    delete:
      operationId: forgejoDisconnect
      tags: [Forgejo]
      summary: Disconnect Forgejo
      description: "Requires: workspace:manage."
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/forgejo/repos:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: forgejoListRepos
      tags: [Forgejo]
      summary: List available and linked repos
      description: "Requires: workspace:manage."
      responses:
        "200":
          description: Repos visible to the token.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ForgejoRepo" }
    post:
      operationId: forgejoLinkRepos
      tags: [Forgejo]
      summary: Link repos
      description: |
        Requires: workspace:manage. Linking creates ku-generated signed
        webhooks on each repo (push/pull_request/create + Actions
        completion).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [forgejo_repo_ids]
              properties:
                forgejo_repo_ids:
                  type: array
                  minItems: 1
                  items: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/forgejo/repos/{id}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: forgejoUnlinkRepo
      tags: [Forgejo]
      summary: Unlink a repo
      description: "Requires: workspace:manage."
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/forgejo/user-mappings:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: forgejoListUserMappings
      tags: [Forgejo]
      summary: List Forgejo → Ku user mappings
      responses:
        "200":
          description: Mappings (unmapped Forgejo logins fall back to unique case-insensitive member-name matches).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ForgejoUserMapping" }
    put:
      operationId: forgejoUpdateUserMappings
      tags: [Forgejo]
      summary: Replace user mappings
      description: "Requires: workspace:manage."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mappings:
                  type: array
                  items: { $ref: "#/components/schemas/ForgejoUserMapping" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/forgejo/auto-transitions:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: forgejoListAutoTransitions
      tags: [Forgejo]
      summary: List automation rules
      responses:
        "200":
          description: Per-event status/assignee transitions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ForgejoAutoTransition" }
    patch:
      operationId: forgejoUpdateAutoTransitions
      tags: [Forgejo]
      summary: Replace automation rules
      description: |
        Requires: workspace:manage. Assignment is additive: a matched
        Forgejo user (or fixed target) is *added* to the assignee set,
        never replacing it. Unknown status ids/slugs reject with
        `400 INVALID_STATUS`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transitions]
              properties:
                transitions:
                  type: array
                  items: { $ref: "#/components/schemas/ForgejoAutoTransition" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/workspaces/{slug}/issues/{identifier}/forgejo:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Identifier"
    get:
      operationId: issueForgejoActivity
      tags: [Forgejo, Issues]
      summary: Issue code activity
      description: Linked branches, PRs, and commits for the issue's identifier.
      responses:
        "200":
          description: Code-activity entries.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }

  /api/workspaces/{slug}/forgejo/issue-links:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - name: identifier
        in: query
        schema: { type: string }
        description: Issue identifier (ENG-12) to look up.
    get:
      operationId: forgejoIssueLinks
      tags: [Forgejo]
      summary: Issue links (agent helper)
      responses:
        "200":
          description: Matching links for the identifier.
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }

  /api/workspaces/{slug}/upload:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: uploadAsset
      tags: [Uploads]
      summary: Upload an attachment
      description: "Requires: issue:create. Returns the asset id used in issue descriptions/comments."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUpload"
      responses:
        "201":
          description: Uploaded asset metadata.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/workspaces/{slug}/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getAsset
      tags: [Uploads]
      summary: Download an asset
      description: |
        Authenticated asset delivery. `?download=1` forces a download
        disposition; non-image content types always download.
      parameters:
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Asset bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /api/workspaces/{slug}/issues/{identifier}/prompt-assets:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Identifier"
    post:
      operationId: signIssuePromptAssets
      tags: [Uploads]
      summary: Sign prompt asset tokens for an issue
      responses:
        "200":
          description: Signed tokens for embedding assets in AI prompts.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/workspaces/{slug}/ws:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: workspaceSocket
      tags: [Realtime]
      summary: Workspace WebSocket
      description: |
        Live event stream (issue updates, board refreshes, comment threads,
        screen-share signaling `share.presence`/`share.signal`). Server
        pings every 20s with a 30s pong deadline; clients reconnect with
        jittered exponential backoff. Authenticate with the access-token
        cookie or `?token=` query parameter.
      responses:
        "101":
          description: WebSocket upgrade.

  /api/notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List notifications
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [inbox, snoozed, archive] }
          description: Inbox view selector.
      responses:
        "200":
          description: Notifications plus unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  unread_count: { type: integer }

  /api/notifications/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateNotification
      tags: [Notifications]
      summary: Update notification state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNotificationRequest" }
      responses:
        "200":
          description: Updated notification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /api/notifications/{id}/read:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Mark read
      responses:
        "200":
          description: Updated notification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /api/notifications/{id}/unread:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: markNotificationUnread
      tags: [Notifications]
      summary: Mark unread
      responses:
        "200":
          description: Updated notification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /api/notifications/{id}/snooze:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: snoozeNotification
      tags: [Notifications]
      summary: Snooze
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                snoozed_until: { type: string, format: date-time }
      responses:
        "200":
          description: Updated notification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /api/notifications/{id}/unsnooze:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: unsnoozeNotification
      tags: [Notifications]
      summary: Un-snooze
      responses:
        "200":
          description: Updated notification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /api/notifications/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: archiveNotification
      tags: [Notifications]
      summary: Archive
      responses:
        "200":
          description: Updated notification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /api/notifications/{id}/unarchive:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: unarchiveNotification
      tags: [Notifications]
      summary: Un-archive
      responses:
        "200":
          description: Updated notification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }

  /api/notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [Notifications]
      summary: Mark everything read
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /api/api-keys:
    get:
      operationId: listApiKeys
      tags: [API Keys]
      summary: List personal API keys
      responses:
        "200":
          description: Key metadata (never the raw token).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIKey" }
    post:
      operationId: createApiKey
      tags: [API Keys]
      summary: Create a personal API key
      description: |
        The raw `ku_...` token is returned exactly once, in this response.
