        organization: { type: string, nullable: true }
        account:
          type: object
          nullable: true
          properties:
            login: { type: string }
            avatar_url: { type: string }
        repos: { type: array, items: { $ref: "#/components/schemas/GitHubRepo" } }
    GitHubRepo:
      type: object
      properties:
        id: { type: string, format: uuid }
        github_repo_id: { type: integer, format: int64 }
