        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, description: Workflow file path. }
        title: { type: string }
        run_number: { type: integer, format: int64 }
        event: { type: string }
        status: { type: string, examples: [queued, in_progress, completed] }
        conclusion: { type: string, description: "Terminal result (success, failure, cancelled, skipped, timed_out, action_required, neutral, startup_failure), or an empty string while active." }
        workflow_id: { type: string }
        head_branch: { type: string, description: Branch name. }
        head_sha: { type: string }
        html_url: { type: string, description: Upstream URL on the configured instance; empty when the upstream URL has another origin. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    GitHubActionRunList:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [data, total_count, page, per_page, has_more]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/GitHubActionRun" } }
    GitHubActionJob:
      type: object
      description: Native GitHub metadata, resolved through the run-jobs list.
      required: [id, run_id, name, status, conclusion, attempt]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        run_id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        status: { type: string }
        conclusion: { type: string, description: "Terminal status, or an empty string while active." }
        attempt: { type: integer, format: int64 }
    GitHubActionJobList:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          required: [data, total_count, page, per_page, has_more]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/GitHubActionJob" } }
    GitHubActionLog:
      type: object
      required: [content, truncated, max_bytes]
      properties:
        content: { type: string, description: "Plain text log content, limited to max_bytes upstream bytes." }
        truncated: { type: boolean }
        max_bytes: { type: integer, enum: [2097152] }

