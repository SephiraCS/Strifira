  /api/workspaces/{slug}/shares:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listScreenShares
      tags: [Screen Shares]
      summary: List screen shares
      description: Active and recent P2P screen-share sessions.
      responses:
        "200":
          description: Active and recent shares.
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: array
                    items: { $ref: "#/components/schemas/ScreenShare" }
                  recent:
                    type: array
                    items: { $ref: "#/components/schemas/ScreenShare" }
    post:
      operationId: createScreenShare
      tags: [Screen Shares]
      summary: Start a screen share
      description: |
        Requires: share:create. Capture screen and audio before creating the
        session, then signal viewers over the workspace WebSocket. The returned
        presenter_token belongs to the capturing tab: include it in presenter
        presence and when ending the share. It is never returned by list/get.
        One active capture per presenter per workspace; a second tab receives
        409 instead of claiming the existing source. Reconnects retain the token.
        A disconnected presenter has 45 seconds to return. Expired sources are
        collected by listing shares or starting a replacement capture, so a
        reloaded tab can start again without a prior list refresh.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Created share.
          content:
            application/json:
              schema:
                type: object
                required: [share, presenter_token]
                properties:
                  share: { $ref: "#/components/schemas/ScreenShare" }
                  presenter_token: { type: string, format: uuid }
        "409":
          description: Presenter already has an active share in this workspace.

  /api/workspaces/{slug}/shares/{id}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getScreenShare
      tags: [Screen Shares]
      summary: Get a screen share
      responses:
        "200":
          description: Share session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScreenShare" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workspaces/{slug}/shares/{id}/end:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Id"
    post:
      operationId: endScreenShare
      tags: [Screen Shares]
      summary: End a screen share
      description: |
        The capturing tab must provide its presenter_token. Workspace owners
        and admins may explicitly send force=true to end any share in this
        workspace. Broadcasts share.ended so viewer walls update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                presenter_token: { type: string, format: uuid }
                force: { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

