        type: { type: string }
        title: { type: string }
        read_at: { type: string, format: date-time, nullable: true }
        snoozed_until: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    UpdateNotificationRequest:
      type: object
      properties:
        read_at: { type: string, format: date-time, nullable: true }
        snoozed_until: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }

    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        read_only: { type: boolean, default: false }
        expires_in_days: { type: integer, minimum: 1, maximum: 3650, nullable: true }
    APIKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string, example: strifira_9f2A }
        scopes: { type: array, items: { type: string, enum: [read, write] } }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    AvatarUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PNG/JPEG/GIF/WebP/AVIF/BMP/SVG, ≤5 MB (magic-byte sniffed).
    FileUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    ImportUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Workspace export archive produced by the export endpoint.

    DevBoxProvider:
      type: object
      required:
      - id
      - version
      properties:
        id:
          type: string
          enum:
          - claude-code
          - codex
          - opencode
        version: {type: string, maxLength: 100}
    DevBox:
      type: object
      required:
      - id
      - workspace_id
      - created_by_user_id
      - name
      - enabled
      - token_prefix
      - providers
      - created_at
      - updated_at
      - online
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        created_by_user_id: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        token_prefix: {type: string, description: Non-secret prefix used to identify the registration token.}
        hostname: {type: string}
        os: {type: string}
        arch: {type: string}
        version: {type: string}
        providers:
          type: array
          items: {$ref: '#/components/schemas/DevBoxProvider'}
        last_seen_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        online: {type: boolean, description: 'True when enabled, unrevoked, and last seen within 90 seconds.'}
    CreateDevBoxRequest:
      type: object
      required:
      - name
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
    UpdateDevBoxRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean}
    DevBoxTokenResponse:
      type: object
      required:
      - box
      - token
      properties:
        box: {$ref: '#/components/schemas/DevBox'}
        token: {type: string, pattern: '^sfw_[0-9a-f]{64}$', description: Shown only by registration or rotation. Not a JWT or
            personal API key.}
    CreateDevBoxJobRequest:
      type: object
      required:
      - issue_id
      - provider
      properties:
        issue_id: {type: string, format: uuid}
        repository_full_name:
          type: string
          maxLength: 500
          description: Optional active linked repository in this workspace, in owner/name form. Overrides saved development defaults for this job only. No repository URL or credentials are accepted.
        base_branch:
          type: string
          maxLength: 255
          description: Optional Git branch for this job. Requires repository_full_name. When selecting a repository without a branch, its linked default branch is used. Omitting both selection fields uses saved development defaults.
        provider:
          type: string
          enum:
          - claude-code
          - codex
          - opencode
        prompt: {type: string, maxLength: 50000, description: Additional instructions. The server includes issue context and the
            no-push contract.}
        test_command:
          type: array
          items: {type: string, minLength: 1, maxLength: 4096}
          maxItems: 32
          description: Argument vector for independent verification after the AI harness exits.
        acceptance_criteria:
          type: array
          items: {type: string, maxLength: 2000}
          maxItems: 50
        max_runtime_seconds: {type: integer, minimum: 30, maximum: 86400, default: 3600}
    DevBoxJobResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum:
          - succeeded
          - failed
          - cancelled
          - timeout
        exit_code: {type: integer}
        summary: {type: string, description: At most 8192 UTF-8 bytes.}
        changed_files:
          type: array
          items: {type: string, maxLength: 4096}
          maxItems: 500
        branch: {type: string, description: 'When present, must equal the assigned working branch.'}
        patch: {type: string, description: Unified Git patch; at most 1 MiB of UTF-8 content.}
        test_status:
          type: string
          enum:
          - passed
          - failed
          - not_run
        test_exit_code: {type: integer}
        tests_run:
          type: array
          items: {type: string, maxLength: 4096}
          maxItems: 100
        risk_notes:
          type: array
          items: {type: string, maxLength: 4096}
          maxItems: 100
    DevBoxJob:
      type: object
      required:
      - id
      - workspace_id
      - box_id
      - requested_by_user_id
      - issue_id
      - github_repo_id
      - provider
      - repository_url
      - working_branch
      - status
      - cancel_requested
      - created_at
      - updated_at
      - logs_bytes
      - logs_truncated
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        box_id: {type: string, format: uuid}
        requested_by_user_id: {type: string, format: uuid}
        issue_id: {type: string, format: uuid}
        issue_identifier: {type: string}
        github_repo_id: {type: string, format: uuid}
        provider:
          type: string
          enum:
          - claude-code
          - codex
          - opencode
        prompt: {type: string}
        repository_url: {type: string, format: uri, description: Canonical linked GitHub URL without credentials.}
        repository_full_name: {type: string}
        base_branch: {type: string}
        working_branch: {type: string}
        test_command:
          type: array
          items: {type: string}
        acceptance_criteria:
          type: array
          items: {type: string}
        max_runtime_seconds: {type: integer}
        status:
          type: string
          enum:
          - queued
          - leased
          - running
          - succeeded
          - failed
          - cancelled
          - timeout
        cancel_requested: {type: boolean}
        lease_expires_at: {type: string, format: date-time}
        deadline_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        result: {$ref: '#/components/schemas/DevBoxJobResult'}
        logs_bytes: {type: integer, format: int64}
        logs_truncated: {type: boolean}
    DevBoxJobList:
      type: object
      required:
      - data
      - total_count
      - page
      - per_page
      - has_more
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/DevBoxJob'}
        total_count: {type: integer}
        page: {type: integer}
        per_page: {type: integer}
        has_more: {type: boolean}
    DevBoxJobLog:
      type: object
      required:
      - id
      - job_id
      - sequence
      - stream
      - content
      - created_at
      properties:
        id: {type: integer, format: int64}
        job_id: {type: string, format: uuid}
        sequence: {type: integer, format: int64, minimum: 1}
        stream:
          type: string
          enum:
          - stdout
          - stderr
          - system
        content: {type: string}
        created_at: {type: string, format: date-time}
    DevBoxHeartbeatRequest:
      type: object
      required:
      - hostname
      - os
      - arch
      - version
      - providers
      properties:
        hostname: {type: string, maxLength: 255}
        os: {type: string, maxLength: 64}
        arch: {type: string, maxLength: 64}
        version: {type: string, maxLength: 100}
        providers:
          type: array
          items: {$ref: '#/components/schemas/DevBoxProvider'}
          maxItems: 3
    DevBoxHeartbeatResponse:
      type: object
      required:
      - box
      - server_time
      - heartbeat_interval_seconds
      properties:
        box: {$ref: '#/components/schemas/DevBox'}
        server_time: {type: string, format: date-time}
        heartbeat_interval_seconds: {type: integer, const: 15}
    DevBoxClaimRequest:
      type: object
      properties: {}
    DevBoxClaimResponse:
      type: object
      required:
      - job
      - lease_token
      - lease_expires_at
      - server_time
      - heartbeat_interval_seconds
      properties:
        job: {$ref: '#/components/schemas/DevBoxJob'}
        lease_token: {type: string, pattern: '^sfl_[0-9a-f]{64}$', description: Separate per-job lease token returned by claim;
            never the registration token.}
        lease_expires_at: {type: string, format: date-time}
        server_time: {type: string, format: date-time}
        heartbeat_interval_seconds: {type: integer, const: 15}
    DevBoxLeaseRequest:
      type: object
      required:
      - lease_token
      properties:
        lease_token: {type: string, pattern: '^sfl_[0-9a-f]{64}$', description: Separate per-job lease token returned by claim;
            never the registration token.}
    DevBoxLeaseResponse:
      type: object
      required:
      - status
      - cancel_requested
      - server_time
      properties:
        status:
          type: string
          enum:
          - queued
          - leased
          - running
          - succeeded
          - failed
          - cancelled
          - timeout
        cancel_requested: {type: boolean}
        lease_expires_at: {type: string, format: date-time}
        deadline_at: {type: string, format: date-time}
        server_time: {type: string, format: date-time}
    DevBoxAppendLogRequest:
      type: object
      required:
      - lease_token
      - sequence
      - stream
      - content
      properties:
        lease_token: {type: string, pattern: '^sfl_[0-9a-f]{64}$', description: Separate per-job lease token returned by claim;
            never the registration token.}
        sequence: {type: integer, format: int64, minimum: 1}
        stream:
          type: string
          enum:
          - stdout
          - stderr
          - system
        content: {type: string, minLength: 1, description: At most 65536 UTF-8 bytes.}
    DevBoxAppendLogResponse:
      type: object
      required:
      - accepted
      - logs_truncated
      properties:
        accepted: {type: boolean}
        logs_truncated: {type: boolean}
    DevBoxCompletionResult:
      allOf:
        - {$ref: '#/components/schemas/DevBoxJobResult'}
        - type: object
          required: [status, test_status]
    DevBoxCompleteRequest:
      type: object
      required:
