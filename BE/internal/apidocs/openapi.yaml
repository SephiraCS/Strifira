              schema: { type: object, additionalProperties: true }

  /mcp:
    post:
      operationId: mcp
      tags: [MCP]
      summary: MCP endpoint (streamable HTTP, stateless)
      description: |
        Model Context Protocol over stateless streamable HTTP. Every POST
        is a self-contained JSON-RPC 2.0 message (`initialize`,
        `tools/list`, `tools/call`); `Mcp-Session-Id` is ignored.
        Authenticate with a personal API key (`Bearer strifira_...`); tools run
        with the key owner's identity and the same workspace RBAC as the
        UI. Read-only keys are limited to query tools. 44 tools cover the
        full ticketing surface (workspaces, teams, states, projects,
        labels, issues, comments, cycles, notifications, analytics,
        GitHub). Friendly references everywhere: teams by key/name/id,
        users by email/name/id, issues by identifier/id.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: JSON-RPC result (or SSE stream for notifications-heavy calls).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/workspaces/{slug}/dev-boxes:
    get:
      operationId: listDevBoxes
      tags:
      - Dev Boxes
      summary: List your dev-box registrations
      description: Requires current workspace membership and development permissions. Only the registration creator can access
        this resource, including for workspace administrators. Disabled in public demos unless the caller is allowed to use
        development features.
      parameters:
      - {$ref: '#/components/parameters/Slug'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DevBox'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
    post:
      operationId: createDevBox
      tags:
      - Dev Boxes
      summary: Register a dev box
      description: Requires current workspace membership and development permissions. Only the registration creator can access
        this resource, including for workspace administrators. Disabled in public demos unless the caller is allowed to use
        development features. The dedicated sfw_ token is returned once. Store it in a protected local token file; Strifira stores
        only its hash.
      parameters:
      - {$ref: '#/components/parameters/Slug'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDevBoxRequest'}
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxTokenResponse'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
        '413': {$ref: '#/components/responses/DevBoxBodyTooLarge'}
  /api/workspaces/{slug}/dev-boxes/{boxId}:
    patch:
      operationId: updateDevBox
      tags:
      - Dev Boxes
      summary: Update a dev-box registration
      description: Requires current workspace membership and development permissions. Only the registration creator can access
        this resource, including for workspace administrators. Disabled in public demos unless the caller is allowed to use
        development features. Disabling the box cancels its queued and active jobs.
      parameters:
      - {$ref: '#/components/parameters/Slug'}
      - {$ref: '#/components/parameters/DevBoxId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDevBoxRequest'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBox'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
        '413': {$ref: '#/components/responses/DevBoxBodyTooLarge'}
    delete:
      operationId: revokeDevBox
      tags:
      - Dev Boxes
      summary: Revoke a dev-box registration
      description: Requires current workspace membership and development permissions. Only the registration creator can access
        this resource, including for workspace administrators. Disabled in public demos unless the caller is allowed to use
        development features. Revocation invalidates the worker token and cancels queued and active jobs.
      parameters:
      - {$ref: '#/components/parameters/Slug'}
      - {$ref: '#/components/parameters/DevBoxId'}
      responses:
        '204': {description: Success.}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
  /api/workspaces/{slug}/dev-boxes/{boxId}/rotate-token:
    post:
      operationId: rotateDevBoxToken
      tags:
      - Dev Boxes
      summary: Rotate a dev-box worker token
      description: Requires current workspace membership and development permissions. Only the registration creator can access
        this resource, including for workspace administrators. Disabled in public demos unless the caller is allowed to use
        development features. The previous token is invalidated and queued and active jobs are cancelled. The replacement token
        is returned once.
      parameters:
      - {$ref: '#/components/parameters/Slug'}
      - {$ref: '#/components/parameters/DevBoxId'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxTokenResponse'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
  /api/workspaces/{slug}/dev-boxes/{boxId}/jobs:
    post:
      operationId: createDevBoxJob
      tags:
      - Dev Boxes
      summary: Queue an issue development job
      description: Requires current workspace membership and development permissions. Only the registration creator can access
        this resource, including for workspace administrators. Disabled in public demos unless the caller is allowed to use
        development features. Resolves the issue/project/team/workspace GitHub repository default to an active linked repository
        and an assigned unique working branch. Provider, repository, and runtime policy applies independently of Docker dev-machine
        availability. The worker uses a preconfigured local repository and does not receive clone credentials or push changes.
      parameters:
      - {$ref: '#/components/parameters/Slug'}
      - {$ref: '#/components/parameters/DevBoxId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDevBoxJobRequest'}
      responses:
        '202':
          description: Job queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxJob'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
        '413': {$ref: '#/components/responses/DevBoxBodyTooLarge'}
  /api/workspaces/{slug}/dev-box-jobs:
    get:
      operationId: listDevBoxJobs
      tags:
      - Dev Boxes
      summary: List your dev-box jobs
      description: Requires current workspace membership and development permissions. Only the registration creator can access
        this resource, including for workspace administrators. Disabled in public demos unless the caller is allowed to use
        development features.
      parameters:
      - {$ref: '#/components/parameters/Slug'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PerPage'}
      - name: issue_id
        in: query
        schema: {type: string, format: uuid}
      - name: box_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxJobList'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
  /api/workspaces/{slug}/dev-box-jobs/{jobId}:
    get:
      operationId: getDevBoxJob
      tags:
      - Dev Boxes
      summary: Read a dev-box job
      description: Requires current workspace membership and development permissions. Only the registration creator can access
        this resource, including for workspace administrators. Disabled in public demos unless the caller is allowed to use
        development features.
      parameters:
      - {$ref: '#/components/parameters/Slug'}
      - {$ref: '#/components/parameters/DevBoxJobId'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxJob'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
  /api/workspaces/{slug}/dev-box-jobs/{jobId}/cancel:
    post:
      operationId: cancelDevBoxJob
      tags:
      - Dev Boxes
      summary: Cancel a dev-box job
      description: Requires current workspace membership and development permissions. Only the registration creator can access
        this resource, including for workspace administrators. Disabled in public demos unless the caller is allowed to use
        development features. Queued jobs terminate immediately; an active worker observes cancellation during its lease heartbeat.
      parameters:
      - {$ref: '#/components/parameters/Slug'}
      - {$ref: '#/components/parameters/DevBoxJobId'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxJob'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
  /api/workspaces/{slug}/dev-box-jobs/{jobId}/logs:
    get:
      operationId: listDevBoxJobLogs
      tags:
      - Dev Boxes
      summary: Read incremental dev-box job logs
      description: Requires current workspace membership and development permissions. Only the registration creator can access
        this resource, including for workspace administrators. Disabled in public demos unless the caller is allowed to use
        development features. Ordered by increasing log ID. Storage is bounded to 4 MiB per job; logs_truncated records omitted
        output.
      parameters:
      - {$ref: '#/components/parameters/Slug'}
      - {$ref: '#/components/parameters/DevBoxJobId'}
      - name: after_id
        in: query
        schema: {type: integer, format: int64, minimum: 0, default: 0}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DevBoxJobLog'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
  /api/dev-box-worker/heartbeat:
    post:
      operationId: heartbeatDevBoxWorker
      tags:
      - Dev Boxes
      summary: Report dev-box capabilities
      description: Requires a dedicated sfw_ registration token. Authentication rechecks whether the box is enabled and unrevoked
        and whether its creator still has current workspace development permissions. Heartbeats update the online indicator
        and installed provider list.
      security:
      - devBoxWorkerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevBoxHeartbeatRequest'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxHeartbeatResponse'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
        '413': {$ref: '#/components/responses/DevBoxBodyTooLarge'}
  /api/dev-box-worker/claim:
    post:
      operationId: claimDevBoxJob
      tags:
      - Dev Boxes
      summary: Claim one eligible dev-box job
      description: Requires a dedicated sfw_ registration token. Authentication rechecks whether the box is enabled and unrevoked
        and whether its creator still has current workspace development permissions. Claiming is atomic; each box can hold only
        one active job. The 60-second lease token is separate from the box token.
      security:
      - devBoxWorkerToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevBoxClaimRequest'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxClaimResponse'}
        '204': {description: No eligible queued job is available.}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
  /api/dev-box-worker/jobs/{jobId}/start:
    post:
      operationId: startDevBoxWorkerJob
      tags:
      - Dev Boxes
      summary: Start a claimed dev-box job
      description: Requires a dedicated sfw_ registration token. Authentication rechecks whether the box is enabled and unrevoked
        and whether its creator still has current workspace development permissions. Requires the matching unexpired lease.
        Cancel and deadline state wins over further execution. Renew before lease expiry, normally every 15 seconds.
      security:
      - devBoxWorkerToken: []
      parameters:
      - {$ref: '#/components/parameters/DevBoxJobId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevBoxLeaseRequest'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxLeaseResponse'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
        '413': {$ref: '#/components/responses/DevBoxBodyTooLarge'}
  /api/dev-box-worker/jobs/{jobId}/renew:
    post:
      operationId: renewDevBoxWorkerJob
      tags:
      - Dev Boxes
      summary: Renew a dev-box job lease
      description: Requires a dedicated sfw_ registration token. Authentication rechecks whether the box is enabled and unrevoked
        and whether its creator still has current workspace development permissions. Requires the matching unexpired lease.
        Cancel and deadline state wins over further execution. Renew before lease expiry, normally every 15 seconds.
      security:
      - devBoxWorkerToken: []
      parameters:
      - {$ref: '#/components/parameters/DevBoxJobId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevBoxLeaseRequest'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxLeaseResponse'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
        '413': {$ref: '#/components/responses/DevBoxBodyTooLarge'}
  /api/dev-box-worker/jobs/{jobId}/logs:
    post:
      operationId: appendDevBoxWorkerLog
      tags:
      - Dev Boxes
      summary: Append a bounded dev-box job log chunk
      description: Requires a dedicated sfw_ registration token. Authentication rechecks whether the box is enabled and unrevoked
        and whether its creator still has current workspace development permissions. Requires the matching unexpired lease.
        Sequence numbers are idempotent; duplicate retries acknowledge the previously accepted chunk without storing it again. Each content chunk is at most 64 KiB and total
        stored output is at most 4 MiB.
      security:
      - devBoxWorkerToken: []
      parameters:
      - {$ref: '#/components/parameters/DevBoxJobId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevBoxAppendLogRequest'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxAppendLogResponse'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
        '413': {$ref: '#/components/responses/DevBoxBodyTooLarge'}
  /api/dev-box-worker/jobs/{jobId}/complete:
    post:
      operationId: completeDevBoxWorkerJob
      tags:
      - Dev Boxes
      summary: Complete a dev-box job
      description: Requires a dedicated sfw_ registration token. Authentication rechecks whether the box is enabled and unrevoked
        and whether its creator still has current workspace development permissions. Requires the matching lease token; retries
        are idempotent. The server validates the assigned branch and independent test report. Failed harness exits or missing/failed
        required tests cannot produce success. Expiry, cancellation, and deadline state override a late success. The patch is
        bounded to 1 MiB; the worker never pushes.
      security:
      - devBoxWorkerToken: []
      parameters:
      - {$ref: '#/components/parameters/DevBoxJobId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevBoxCompleteRequest'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevBoxJob'}
        '400': {$ref: '#/components/responses/DevBoxBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/DevBoxConflict'}
        '413': {$ref: '#/components/responses/DevBoxBodyTooLarge'}


components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Session access token (15-minute JWT). The browser uses the
        HttpOnly `access_token` cookie; programmatic clients send
        `Authorization: Bearer <access_token>` with the token from
        POST /api/auth/login.
    apiKeyAuth:
      type: http
      scheme: bearer
      description: Personal API key (`strifira_...`) from Settings → Personal → API Keys. MCP endpoint only.
    machineToken:
      type: http
      scheme: bearer
      description: Dev-machine ingest token issued when the machine is created. Internal.

    devBoxWorkerToken:
      type: http
      scheme: bearer
      description: Dedicated strifira_ dev-box registration token; only the worker API accepts it. Creator membership and development permissions are rechecked on every request.

  parameters:
    DevBoxId:
      name: boxId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DevBoxJobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}

    Slug:
      name: slug
      in: path
      required: true
      description: Workspace slug.
      schema: { type: string }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatusId:
      name: statusId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CycleId:
      name: cycleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Identifier:
      name: identifier
      in: path
      required: true
      description: Human issue identifier, e.g. ENG-12.
      schema: { type: string, pattern: "^[A-Z]+-\\d+$" }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RelationId:
      name: relationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareToken:
      name: token
      in: path
      required: true
      schema: { type: string }
    MachineId:
      name: machineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentRunId:
      name: agentRunId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceName:
      name: service
      in: path
      required: true
      schema: { type: string }
    GitHubLinkedRepoId:
      name: repoId
      in: path
      required: true
      description: UUID of an active Strifira repository link in this workspace (not the upstream numeric repository ID).
      schema: { type: string, format: uuid }
    GitHubActionRunId:
      name: runId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    GitHubActionJobId:
      name: jobId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    GitHubActionsPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    Ok:
      description: Success (opaque payload).
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    ValidationError:
      description: Invalid input (`VALIDATION_ERROR` with field details).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid credentials (`UNAUTHORIZED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Authenticated but not permitted (`FORBIDDEN`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource does not exist (`NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Too many requests (machine ingest limits).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    GitHubActionsBadRequest:
      description: Invalid ID, pagination, or filters (`BAD_REQUEST`), or GitHub rejected the request (`GITHUB_ACTION_REJECTED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    GitHubActionsNotFound:
      description: Repository is not linked in this workspace (`NOT_FOUND`), or upstream run/job/API is absent (`ACTION_NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    GitHubActionsConflict:
      description: Workspace connection does not match the linked repository (`GITHUB_CONNECTION_UNAVAILABLE`), or the run state forbids this action (`ACTION_STATE_CONFLICT`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    GitHubActionsUpstreamError:
      description: The configured token cannot access Actions (`GITHUB_ACCESS_DENIED`), or GitHub is unavailable (`GITHUB_UNAVAILABLE`). Upstream bodies and credentials are never returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    GitHubActionsRateLimited:
      description: GitHub is rate limiting requests (`GITHUB_RATE_LIMITED`); retry later.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    GitHubActionsTimeout:
      description: GitHub did not respond in time (`GITHUB_TIMEOUT`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    DevBoxBadRequest:
      description: Invalid IDs, query, or body (BAD_REQUEST), or invalid fields (VALIDATION_ERROR).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    DevBoxConflict:
      description: Registration/job conflict (DEV_BOX_CONFLICT), or the lease is invalid, stale, or belongs to another worker
        (LEASE_LOST).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    DevBoxBodyTooLarge:
      description: The request exceeds the bounded body size (BODY_TOO_LARGE).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}


  schemas:
    ErrorDetail:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string }
            details:
              type: array
              items: { $ref: "#/components/schemas/ErrorDetail" }
    PaginationMeta:
      type: object
      properties:
        total_count: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
        has_more: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
    RegisterRequest:
      allOf:
        - $ref: "#/components/schemas/LoginRequest"
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        expires_in: { type: integer, description: Seconds until the access token expires (900). }
    UpdateProfileRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        display_name: { type: string, maxLength: 100, nullable: true }
