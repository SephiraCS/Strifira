        assignee: { $ref: "#/components/schemas/User" }
        assignees: { type: array, items: { $ref: "#/components/schemas/User" } }
        parent: { $ref: "#/components/schemas/IssueSummary" }
        sub_issue_count: { type: integer }
        sub_issue_done: { type: integer }
        relation_counts:
