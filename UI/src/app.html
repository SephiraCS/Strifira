<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Strifira" />
		<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Strifira</title>
		<script>
			(function() {
				try {
					var raw = localStorage.getItem('strifira-preferences');
					var prefs = raw ? JSON.parse(raw) : {};
					var mode = prefs.themeMode || 'dark';
					if (mode === 'system') {
						mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					var theme = mode === 'dark'
						? (prefs.darkTheme || 'dark')
						: (prefs.lightTheme || 'light');
					var classes = theme;
					if (prefs.pointerCursors !== false) {
						classes += ' pointer-cursors';
					}
					document.documentElement.className = classes;
					var fontMap = { small: '87.5%', default: '100%', large: '112.5%' };
					var fs = fontMap[prefs.fontSize] || '100%';
					document.documentElement.style.setProperty('--app-font-size', fs);
				} catch (e) {
					document.documentElement.className = 'dark pointer-cursors';
					document.documentElement.style.setProperty('--app-font-size', '100%');
				}
			})();
		</script>
		<script>
			// Installable web app: register the passthrough service worker
			// after first paint. Failures are non-fatal.
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function () {
					navigator.serviceWorker.register('%sveltekit.assets%/sw.js').catch(function () {});
				});
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
