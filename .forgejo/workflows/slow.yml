name: Slow Tests

# The slow suite (AGENTS.md): every integration test that is not on a
# deploy's critical path. It runs next to ci.yml after each push to main,
# nightly, and on demand (`fj actions dispatch slow.yml main`). It never
# blocks a deploy and is never a required check; a failure files or updates
# the open "Slow test suite failed" issue (scripts/ci/report-failure.sh).
#
# Membership (see the Makefile): Go tests named TestSlow*, the Playwright
# specs not in FAST_SPECS (UI/playwright.config.ts), and the disposable live
# checks in scripts/check-*-live.*. Release commits are pushed with the job
# token, so they do not start this workflow.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

# A newer push tests a superset, so an older run still in progress yields.
concurrency:
  group: ku-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  zero-config:
    name: Reject new configuration switches
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the exact change with its history
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared TerraScale policy
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          repository: TerraScale/ts-builder
          ref: 4abae826a08090c4505d7c8f3d7adcd78be616ef
          path: .zero-config-policy
          token: ${{ secrets.TERRASCALE_BOT_TOKEN }}
          persist-credentials: false
      - name: Check the added lines
        env:
          ZERO_CONFIG_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
          ZERO_CONFIG_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 .zero-config-policy/scripts/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"

  backend:
    needs: [zero-config]
    name: Slow Suite (backend)
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          persist-credentials: false

      - name: Create the podman store
        run: scripts/ci/podman-store.sh create slow-backend

      # Same throwaway services as ci.yml's backend job.
      - name: Start PostgreSQL and Redis
        run: |
          set -euo pipefail
          podman run --detach --cgroups=disabled --name ku-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=ku --env POSTGRES_PASSWORD=ku --env POSTGRES_DB=ku_test \
            docker.io/library/postgres:16-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          podman run --detach --cgroups=disabled --name ku-redis \
            --publish 127.0.0.1:6379:6379 \
            docker.io/library/redis:7-alpine
          for _ in $(seq 1 30); do
            podman exec ku-postgres pg_isready -h 127.0.0.1 -U ku -d ku_test >/dev/null 2>&1 && break
            sleep 2
          done
          podman exec ku-postgres pg_isready -h 127.0.0.1 -U ku -d ku_test
          podman exec ku-redis redis-cli ping

      - name: Slow suite (backend)
        env:
          DATABASE_URL: postgres://ku:ku@localhost:5432/ku_test?sslmode=disable
          TEST_DATABASE_URL: postgres://ku:ku@localhost:5432/ku_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-that-is-at-least-32-characters-long
        run: make test-slow-backend

      - name: Remove the podman store
        if: always()
        run: scripts/ci/podman-store.sh remove

  frontend:
    needs: [zero-config]
    name: Slow Suite (browser)
    runs-on: terrascale-builder
    timeout-minutes: 40
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          persist-credentials: false

      - name: Install dependencies
        working-directory: UI
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx playwright install chromium ffmpeg

      # The Playwright web server builds the app first.
      - name: Slow suite (browser)
        run: make test-slow-frontend E2E_FLAGS="--workers=2"

      # Artifacts are unavailable on this runner; keep failure context in the log.
      - name: Print failure context
        if: failure()
        working-directory: UI
        run: |
          find test-results -name 'error-context.md' -print -exec cat {} \; 2>/dev/null | head -c 200000 || true

  live:
    needs: [zero-config]
    name: Slow Suite (live checks)
    runs-on: terrascale-builder
    timeout-minutes: 40
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          persist-credentials: false

      # The live checks start their own containers with plain `podman run`;
      # nested podman in the job needs cgroups disabled (see ci.yml).
      - name: Create the podman store
        run: |
          scripts/ci/podman-store.sh create slow-live
          store=$(sed -n 's/^PODMAN_STORE=//p' "$GITHUB_ENV" | tail -n 1)
          printf '\n[containers]\ncgroups = "disabled"\n' >> "$store/containers.conf"

      - name: Install dependencies
        working-directory: UI
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx playwright install chromium ffmpeg

      # The screen-share check always runs. The AI provider check runs only
      # when the KU_LIVE_PROVIDER_* secrets are set; without them it is
      # skipped with a notice. check-dev-box-live.py needs an authenticated
      # coding CLI on a dev VM and stays a manual check.
      - name: Slow suite (live checks)
        env:
          KU_LIVE_PROVIDER_KEY: ${{ secrets.KU_LIVE_PROVIDER_KEY }}
          KU_LIVE_PROVIDER_URL: ${{ secrets.KU_LIVE_PROVIDER_URL }}
          KU_LIVE_PROVIDER_MODEL: ${{ secrets.KU_LIVE_PROVIDER_MODEL }}
        run: make test-slow-live

      - name: Remove the podman store
        if: always()
        run: scripts/ci/podman-store.sh remove

  report:
    name: Report the failure
    needs: [zero-config, backend, frontend, live]
    if: failure() && needs.zero-config.result == 'success'
    runs-on: terrascale-builder
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          persist-credentials: false

      - name: File the failure as an issue
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          REPORT_TITLE: 'Slow test suite failed'
          REPRO: |
            # PostgreSQL and Redis first: make dev-start-services
            make test-slow
            # or one part: make test-slow-backend | test-slow-frontend | test-slow-live
        run: scripts/ci/report-failure.sh
