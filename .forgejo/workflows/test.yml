name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: terrascale-builder
    timeout-minutes: 30

    # The runner's service containers are not reachable from job containers on
    # this instance, so PostgreSQL and Redis run as rootful podman containers
    # inside the privileged job (the engine the builder image ships with).
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Set up Go
        uses: https://data.forgejo.org/actions/setup-go@v6.4.0
        with:
          # go-version-file is ignored by this action build and its
          # preinstalled-version fallback runs a literal `version` command;
          # pin the toolchain explicitly instead.
          go-version: '1.27'
          cache: false

      - name: Run backend tests
        working-directory: BE
        env:
          DATABASE_URL: postgres://ku:ku@localhost:5432/ku_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-that-is-at-least-32-characters-long
        run: |
          set -o pipefail
          {
            echo '--- start postgres and redis ---'
            podman run --detach --name ku-postgres \
              --publish 127.0.0.1:5432:5432 \
              --env POSTGRES_USER=ku --env POSTGRES_PASSWORD=ku --env POSTGRES_DB=ku_test \
              docker.io/library/postgres:16-alpine
            podman run --detach --name ku-redis \
              --publish 127.0.0.1:6379:6379 \
              docker.io/library/redis:7-alpine

            for _ in $(seq 1 30); do
              podman exec ku-postgres pg_isready -U ku >/dev/null 2>&1 && break
              sleep 2
            done
            podman exec ku-postgres pg_isready -U ku
            podman exec ku-redis redis-cli ping

            echo '--- apply database migrations ---'
            go run ./cmd/server migrate up

            echo '--- run tests with coverage ---'
            go test ./... -race -coverprofile=coverage.out -covermode=atomic -count=1

            echo '--- coverage summary ---'
            go tool cover -func=coverage.out

            echo 'LANE-COMPLETE'
          } 2>&1 | tee backend-test.log

      - name: Upload coverage artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v7.0.1
        with:
          name: backend-coverage
          path: BE/coverage.out

      - name: Publish job log (temporary)
        if: always()
        continue-on-error: true
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
        run: |
          cd BE
          [ -f backend-test.log ] || echo "(no log captured; failure was in an action step)" > backend-test.log
          git config user.name "forgejo-actions[bot]"
          git config user.email "noreply@git.terrascale.tech"
          git fetch origin ci/logs 2>/dev/null && git checkout -B ci/logs FETCH_HEAD || git checkout -B ci/logs
          mv backend-test.log "backend-${GITHUB_RUN_ID}.log"
          git add "backend-${GITHUB_RUN_ID}.log"
          git commit -m "backend-test log run ${GITHUB_RUN_ID}"
          remote_url="https://${FORGEJO_ACTOR}:${FORGEJO_TOKEN}@git.terrascale.tech/TerraScale/ku.git"
          # `git push ... && break` exits the shell on the first rejection
          # under set -e; use an explicit if so retries actually happen, and
          # space them out — all lanes race on the same branch.
          for _ in 1 2 3 4 5; do
            if git push "$remote_url" HEAD:ci/logs; then break; fi
            git fetch origin ci/logs
            git rebase FETCH_HEAD
            sleep 3
          done

  docker-integration:
    # The backend manages dev-machine containers through the Docker SDK, so
    # this lane needs the host Docker socket (mounted by the runner), not just
    # any rootless engine. The builder image ships podman/buildah, so the
    # Docker CLI is installed on demand when the socket is reachable.
    name: Docker Runtime Integration
    runs-on: terrascale-builder
    timeout-minutes: 45

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Set up Go
        uses: https://data.forgejo.org/actions/setup-go@v6.4.0
        with:
          # go-version-file is ignored by this action build and its
          # preinstalled-version fallback runs a literal `version` command;
          # pin the toolchain explicitly instead.
          go-version: '1.27'
          cache: false

      - name: Run Docker lifecycle integration test
        working-directory: BE
        env:
          KU_DOCKER_INTEGRATION: '1'
        run: |
          set -o pipefail
          {
            echo '--- ensure docker cli and check daemon socket ---'
            if ! command -v docker >/dev/null 2>&1 && [ -S /var/run/docker.sock ]; then
              apt-get update -qq >/dev/null && apt-get install -y -qq docker.io >/dev/null
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "Docker daemon socket not usable from this job; skipping the Docker lifecycle integration test."
              echo 'LANE-COMPLETE (skipped)'
              exit 0
            fi

            echo '--- build integration runtime images ---'
            cd ..
            docker build --pull --tag ku/dev-machine-ide:0.1.0 --file devmachine/ide/Dockerfile devmachine
            docker build --pull --tag ku/dev-machine-browser:0.1.0 --file devmachine/browser/Dockerfile devmachine
            docker build --pull --tag ku/dev-machine-collector:0.1.0 --file devmachine/collector/Dockerfile devmachine
            docker build --pull --tag ku/dev-machine-egress:0.1.0 --file devmachine/egress/Dockerfile devmachine
            docker build --pull --build-arg PROVIDER=claude-code --tag ku/dev-machine-agent-claude:0.1.0 --file devmachine/agent/Dockerfile devmachine
            cd BE

            echo '--- run lifecycle test ---'
            go test ./internal/machine -run '^TestDockerRuntimeLifecycle$' -race -count=1 -v -timeout=5m

            echo 'LANE-COMPLETE'
          } 2>&1 | tee docker-integration.log

      - name: Publish job log (temporary)
        if: always()
        continue-on-error: true
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
        run: |
          cd BE
          [ -f docker-integration.log ] || echo "(no log captured; failure was in an action step)" > docker-integration.log
          git config user.name "forgejo-actions[bot]"
          git config user.email "noreply@git.terrascale.tech"
          git fetch origin ci/logs 2>/dev/null && git checkout -B ci/logs FETCH_HEAD || git checkout -B ci/logs
          mv docker-integration.log "docker-${GITHUB_RUN_ID}.log"
          git add "docker-${GITHUB_RUN_ID}.log"
          git commit -m "docker-integration log run ${GITHUB_RUN_ID}"
          remote_url="https://${FORGEJO_ACTOR}:${FORGEJO_TOKEN}@git.terrascale.tech/TerraScale/ku.git"
          # `git push ... && break` exits the shell on the first rejection
          # under set -e; use an explicit if so retries actually happen, and
          # space them out — all lanes race on the same branch.
          for _ in 1 2 3 4 5; do
            if git push "$remote_url" HEAD:ci/logs; then break; fi
            git fetch origin ci/logs
            git rebase FETCH_HEAD
            sleep 3
          done

  frontend-check:
    name: Frontend Checks
    runs-on: terrascale-builder
    timeout-minutes: 30

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      # The terrascale-builder image ships the Node toolchain; Playwright
      # browsers are NOT preinstalled on the runner, so install the matching
      # build (with system libraries) before the browser suite.
      - name: Run frontend checks
        working-directory: UI
        run: |
          set -o pipefail
          {
            echo '--- toolchain ---'
            node --version
            npm --version

            echo '--- install dependencies ---'
            npm ci

            echo '--- svelte check ---'
            npm run check

            echo '--- unit tests ---'
            npm run test:unit

            echo '--- install playwright browsers ---'
            npx playwright install --with-deps chromium

            echo '--- dev machine browser tests ---'
            npm run test:e2e

            echo 'LANE-COMPLETE'
          } 2>&1 | tee frontend-check.log

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: https://data.forgejo.org/actions/upload-artifact@v7.0.1
        with:
          name: ui-playwright-failure
          path: |
            UI/playwright-report
            UI/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish job log (temporary)
        if: always()
        continue-on-error: true
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
        run: |
          cd UI
          [ -f frontend-check.log ] || echo "(no log captured; failure was in an action step)" > frontend-check.log
          git config user.name "forgejo-actions[bot]"
          git config user.email "noreply@git.terrascale.tech"
          git fetch origin ci/logs 2>/dev/null && git checkout -B ci/logs FETCH_HEAD || git checkout -B ci/logs
          mv frontend-check.log "frontend-${GITHUB_RUN_ID}.log"
          git add "frontend-${GITHUB_RUN_ID}.log"
          git commit -m "frontend-check log run ${GITHUB_RUN_ID}"
          remote_url="https://${FORGEJO_ACTOR}:${FORGEJO_TOKEN}@git.terrascale.tech/TerraScale/ku.git"
          # `git push ... && break` exits the shell on the first rejection
          # under set -e; use an explicit if so retries actually happen, and
          # space them out — all lanes race on the same branch.
          for _ in 1 2 3 4 5; do
            if git push "$remote_url" HEAD:ci/logs; then break; fi
            git fetch origin ci/logs
            git rebase FETCH_HEAD
            sleep 3
          done

  web-check:
    name: Marketing Site Checks
    runs-on: terrascale-builder
    timeout-minutes: 30

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Run marketing site checks
        working-directory: WEB
        run: |
          set -o pipefail
          {
            echo '--- toolchain ---'
            node --version
            npm --version

            echo '--- install dependencies ---'
            npm ci

            echo '--- svelte check ---'
            npm run check

            echo '--- build + seo validation ---'
            npm run validate

            echo '--- responsive layout tests ---'
            npm run test:responsive

            echo 'LANE-COMPLETE'
          } 2>&1 | tee web-check.log

      - name: Publish job log (temporary)
        if: always()
        continue-on-error: true
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
        run: |
          cd WEB
          [ -f web-check.log ] || echo "(no log captured; failure was in an action step)" > web-check.log
          git config user.name "forgejo-actions[bot]"
          git config user.email "noreply@git.terrascale.tech"
          git fetch origin ci/logs 2>/dev/null && git checkout -B ci/logs FETCH_HEAD || git checkout -B ci/logs
          mv web-check.log "web-${GITHUB_RUN_ID}.log"
          git add "web-${GITHUB_RUN_ID}.log"
          git commit -m "web-check log run ${GITHUB_RUN_ID}"
          remote_url="https://${FORGEJO_ACTOR}:${FORGEJO_TOKEN}@git.terrascale.tech/TerraScale/ku.git"
          # `git push ... && break` exits the shell on the first rejection
          # under set -e; use an explicit if so retries actually happen, and
          # space them out — all lanes race on the same branch.
          for _ in 1 2 3 4 5; do
            if git push "$remote_url" HEAD:ci/logs; then break; fi
            git fetch origin ci/logs
            git rebase FETCH_HEAD
            sleep 3
          done

  # TEMPORARY: publishes each lane's outcome to the ci/status branch so run
  # results are readable without web access during the CI migration. Remove
  # once the workflows are verified on this instance.
  report:
    name: Report results (temporary)
    if: always()
    needs: [backend-test, docker-integration, frontend-check, web-check]
    runs-on: terrascale-builder
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Publish job results
        continue-on-error: true
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          {
            echo "tests at $(date -u +%Y-%m-%dT%H:%M:%SZ) sha=${{ forgejo.sha }} event=${{ forgejo.event_name }}"
            echo "backend-test: ${{ needs.backend-test.result }}"
            echo "docker-integration: ${{ needs.docker-integration.result }}"
            echo "frontend-check: ${{ needs.frontend-check.result }}"
            echo "web-check: ${{ needs.web-check.result }}"
          } | tee "tests-${stamp}.txt"

          git config user.name "forgejo-actions[bot]"
          git config user.email "noreply@git.terrascale.tech"
          git fetch origin ci/status 2>/dev/null
          git checkout -B ci/status FETCH_HEAD 2>/dev/null || git checkout -B ci/status
          git add "tests-${stamp}.txt"
          git commit -m "tests status ${stamp}"
          remote_url="https://${FORGEJO_ACTOR}:${FORGEJO_TOKEN}@git.terrascale.tech/TerraScale/ku.git"
          for _ in 1 2 3 4 5; do
            if git push "$remote_url" HEAD:ci/status; then break; fi
            git fetch origin ci/status
            git rebase FETCH_HEAD
            sleep 3
          done