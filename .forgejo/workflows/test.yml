name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: terrascale-builder
    timeout-minutes: 30

    # The runner's service containers are not reachable from job containers on
    # this instance, so PostgreSQL and Redis run as rootful podman containers
    # inside the privileged job (the engine the builder image ships with).
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      # The builder image ships no Go and this runner never delivers `with:`
      # inputs to setup-go (both go-version-file and go-version arrive empty,
      # then its fallback runs a literal `version` command), so install the
      # toolchain directly. Skips itself once the image ships Go 1.27.
      - name: Install Go toolchain
        run: |
          if command -v go >/dev/null 2>&1 && go version | grep -q 'go1.27'; then
            go version
            exit 0
          fi
          curl -fsSL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz -o /tmp/go.tgz
          rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tgz
          echo '/usr/local/go/bin' >> "$GITHUB_PATH"
          /usr/local/go/bin/go version

      - name: Run backend tests
        working-directory: BE
        env:
          DATABASE_URL: postgres://ku:ku@localhost:5432/ku_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-that-is-at-least-32-characters-long
        run: |
          set -o pipefail
          {
            echo '--- start postgres and redis ---'
            podman run --detach --name ku-postgres \
              --publish 127.0.0.1:5432:5432 \
              --env POSTGRES_USER=ku --env POSTGRES_PASSWORD=ku --env POSTGRES_DB=ku_test \
              docker.io/library/postgres:16-alpine
            podman run --detach --name ku-redis \
              --publish 127.0.0.1:6379:6379 \
              docker.io/library/redis:7-alpine

            for _ in $(seq 1 30); do
              podman exec ku-postgres pg_isready -U ku >/dev/null 2>&1 && break
              sleep 2
            done
            podman exec ku-postgres pg_isready -U ku
            podman exec ku-redis redis-cli ping

            echo '--- apply database migrations ---'
            go run ./cmd/server migrate up

            echo '--- run tests with coverage ---'
            go test ./... -race -coverprofile=coverage.out -covermode=atomic -count=1

            echo '--- coverage summary ---'
            go tool cover -func=coverage.out

            echo 'LANE-COMPLETE'
          } 2>&1 | tee backend-test.log

  docker-integration:
    # The backend manages dev-machine containers through the Docker SDK, so
    # this lane needs the host Docker socket (mounted by the runner), not just
    # any rootless engine. The builder image ships podman/buildah, so the
    # Docker CLI is installed on demand when the socket is reachable.
    name: Docker Runtime Integration
    runs-on: terrascale-builder
    timeout-minutes: 45

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      # The builder image ships no Go and this runner never delivers `with:`
      # inputs to setup-go (both go-version-file and go-version arrive empty,
      # then its fallback runs a literal `version` command), so install the
      # toolchain directly. Skips itself once the image ships Go 1.27.
      - name: Install Go toolchain
        run: |
          if command -v go >/dev/null 2>&1 && go version | grep -q 'go1.27'; then
            go version
            exit 0
          fi
          curl -fsSL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz -o /tmp/go.tgz
          rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tgz
          echo '/usr/local/go/bin' >> "$GITHUB_PATH"
          /usr/local/go/bin/go version

      - name: Run Docker lifecycle integration test
        working-directory: BE
        env:
          KU_DOCKER_INTEGRATION: '1'
        run: |
          set -o pipefail
          {
            echo '--- ensure docker cli and check daemon socket ---'
            if ! command -v docker >/dev/null 2>&1 && [ -S /var/run/docker.sock ]; then
              apt-get update -qq >/dev/null && apt-get install -y -qq docker.io >/dev/null
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "Docker daemon socket not usable from this job; skipping the Docker lifecycle integration test."
              echo 'LANE-COMPLETE (skipped)'
              exit 0
            fi

            echo '--- build integration runtime images ---'
            cd ..
            # The classic builder never sets TARGETARCH (BuildKit-only ARG);
            # pass the host architecture explicitly.
            build_arch="$(dpkg --print-architecture)"
            docker build --pull --build-arg TARGETARCH="$build_arch" --tag ku/dev-machine-ide:0.1.0 --file devmachine/ide/Dockerfile devmachine
            docker build --pull --build-arg TARGETARCH="$build_arch" --tag ku/dev-machine-browser:0.1.0 --file devmachine/browser/Dockerfile devmachine
            docker build --pull --build-arg TARGETARCH="$build_arch" --tag ku/dev-machine-collector:0.1.0 --file devmachine/collector/Dockerfile devmachine
            docker build --pull --build-arg TARGETARCH="$build_arch" --tag ku/dev-machine-egress:0.1.0 --file devmachine/egress/Dockerfile devmachine
            docker build --pull --build-arg TARGETARCH="$build_arch" --build-arg PROVIDER=claude-code --tag ku/dev-machine-agent-claude:0.1.0 --file devmachine/agent/Dockerfile devmachine
            cd BE

            echo '--- run lifecycle test ---'
            go test ./internal/machine -run '^TestDockerRuntimeLifecycle$' -race -count=1 -v -timeout=5m

            echo 'LANE-COMPLETE'
          } 2>&1 | tee docker-integration.log

  frontend-check:
    name: Frontend Checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      # The runner image reports Ubuntu 26.04 while Playwright 1.58 ships
      # browser builds for the Ubuntu 24.04 platform identifier.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      # The terrascale-builder image ships the Node toolchain; Playwright
      # browsers are NOT preinstalled on the runner, so install the matching
      # build (with system libraries) before the browser suite.
      - name: Run frontend checks
        working-directory: UI
        run: |
          set -o pipefail
          {
            echo '--- toolchain ---'
            node --version
            npm --version

            echo '--- install dependencies ---'
            npm ci

            echo '--- svelte check ---'
            npm run check

            echo '--- unit tests ---'
            npm run test:unit

            echo '--- install playwright browsers ---'
            npx playwright install chromium

            echo '--- dev machine browser tests ---'
            npm run test:e2e

            echo 'LANE-COMPLETE'
          } 2>&1 | tee frontend-check.log

  web-check:
    name: Marketing Site Checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    env:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Run marketing site checks
        working-directory: WEB
        run: |
          set -o pipefail
          {
            echo '--- toolchain ---'
            node --version
            npm --version

            echo '--- install dependencies ---'
            npm ci

            echo '--- svelte check ---'
            npm run check

            echo '--- build + seo validation ---'
            npm run validate

            echo '--- install playwright browsers ---'
            npx playwright install chromium

            echo '--- responsive layout tests ---'
            npm run test:responsive

            echo 'LANE-COMPLETE'
          } 2>&1 | tee web-check.log

  # Keep the aggregate lane result visible in the Actions UI without pushing
  # diagnostic refs back into the source repository.
  report:
    name: Report results (temporary)
    if: always()
    needs: [backend-test, docker-integration, frontend-check, web-check]
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Print job results
        run: |
          echo "tests at $(date -u +%Y-%m-%dT%H:%M:%SZ) sha=${{ forgejo.sha }} event=${{ forgejo.event_name }}"
          echo "backend-test: ${{ needs.backend-test.result }}"
          echo "docker-integration: ${{ needs.docker-integration.result }}"
          echo "frontend-check: ${{ needs.frontend-check.result }}"
          echo "web-check: ${{ needs.web-check.result }}"
