name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: terrascale-builder
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./BE

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ku
          POSTGRES_PASSWORD: ku
          POSTGRES_DB: ku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ku"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Set up Go
        uses: https://data.forgejo.org/actions/setup-go@v6.4.0
        with:
          go-version-file: BE/go.mod
          cache: false

      - name: Apply database migrations
        env:
          DATABASE_URL: postgres://ku:ku@localhost:5432/ku_test?sslmode=disable
        run: go run ./cmd/server migrate up

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://ku:ku@localhost:5432/ku_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-that-is-at-least-32-characters-long
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic -count=1

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v7.0.1
        with:
          name: backend-coverage
          path: BE/coverage.out

  docker-integration:
    # The backend manages dev-machine containers through the Docker SDK, so
    # this lane needs the host Docker socket (mounted by the runner), not just
    # any rootless engine. The builder image ships podman/buildah, so the
    # Docker CLI is installed on demand when the socket is reachable.
    name: Docker Runtime Integration
    runs-on: terrascale-builder
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./BE

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Set up Go
        uses: https://data.forgejo.org/actions/setup-go@v6.4.0
        with:
          go-version-file: BE/go.mod
          cache: false

      - name: Ensure Docker CLI and check the daemon socket
        id: docker
        working-directory: .
        run: |
          if ! command -v docker >/dev/null 2>&1 && [ -S /var/run/docker.sock ]; then
            apt-get update -qq >/dev/null && apt-get install -y -qq docker.io >/dev/null
          fi
          if docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker daemon socket not usable from this job; skipping the Docker lifecycle integration test."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build integration runtime images
        if: steps.docker.outputs.available == 'true'
        working-directory: .
        run: |
          docker build --pull --tag ku/dev-machine-ide:0.1.0 --file devmachine/ide/Dockerfile devmachine
          docker build --pull --tag ku/dev-machine-browser:0.1.0 --file devmachine/browser/Dockerfile devmachine
          docker build --pull --tag ku/dev-machine-collector:0.1.0 --file devmachine/collector/Dockerfile devmachine
          docker build --pull --tag ku/dev-machine-egress:0.1.0 --file devmachine/egress/Dockerfile devmachine
          docker build --pull --build-arg PROVIDER=claude-code --tag ku/dev-machine-agent-claude:0.1.0 --file devmachine/agent/Dockerfile devmachine

      - name: Run Docker lifecycle integration test
        if: steps.docker.outputs.available == 'true'
        env:
          KU_DOCKER_INTEGRATION: '1'
        run: go test ./internal/machine -run '^TestDockerRuntimeLifecycle$' -race -count=1 -v -timeout=5m

  frontend-check:
    name: Frontend Checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./UI

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      # The terrascale-builder image ships the Node toolchain and Playwright
      # browsers (PLAYWRIGHT_BROWSERS_PATH is preset), so no setup-node or
      # browser download with system dependencies is needed here.
      - name: Install dependencies
        run: npm ci

      - name: Svelte check (type checking)
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Ensure Playwright browser revision
        run: npx playwright install chromium

      - name: Dev Machine browser tests
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: https://data.forgejo.org/actions/upload-artifact@v7.0.1
        with:
          name: ui-playwright-failure
          path: |
            UI/playwright-report
            UI/test-results
          if-no-files-found: ignore
          retention-days: 7

  web-check:
    name: Marketing Site Checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./WEB

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Svelte check (type checking)
        run: npm run check

      - name: Build + SEO validation
        run: npm run validate

      - name: Ensure Playwright browser revision
        run: npx playwright install chromium

      - name: Responsive layout tests
        run: npm run test:responsive
