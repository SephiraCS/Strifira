# TEMPORARY: creates the Forgejo release for a pushed v* tag using the job
# token, which fires the Build & Push release lane. This keeps release
# creation scriptable (no web session) while the CI migration is verified.
# Remove once releases are managed directly.
name: Release Trigger (temporary)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    name: Create the release for this tag
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Create the Forgejo release
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          TAG: ${{ forgejo.ref_name }}
        run: |
          set -eu
          code="$(curl -s -w '%{http_code}' -o /tmp/release.json \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":false}" \
            https://git.terrascale.tech/api/v1/repos/TerraScale/ku/releases)"
          case "${code}" in
            201) echo "release ${TAG} created" ;;
            409) echo "release ${TAG} already exists" ;;
            *) echo "release creation failed with HTTP ${code}:" >&2; cat /tmp/release.json >&2; exit 1 ;;
          esac
