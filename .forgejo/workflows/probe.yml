name: Probe

# Throwaway diagnostics: fetches the logs of the recently failed Release and
# report jobs through the job token (proven to work) and publishes them to
# the probe-results branch. Every stage is defensive: partial results are
# pushed no matter what breaks.
on: workflow_dispatch

jobs:
  probe:
    name: Fetch failed job logs
    runs-on: terrascale-builder
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the probe branch
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Fetch the failed jobs' logs
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          api=https://git.terrascale.tech/api/v1/repos/TerraScale/ku
          auth="Authorization: token $FORGEJO_TOKEN"
          out=probe-results.txt
          : >"$out"
          apiget() { curl -s --max-time 30 -H "$auth" "$1"; }
          {
            echo "probe start $(date -u)"
            apiget "$api/actions/tasks?limit=300" > /tmp/tasks.json
            echo "tasks bytes: $(wc -c </tmp/tasks.json)"
            head -c 400 /tmp/tasks.json; echo
            jq -r 'if type == "array" then . elif has("entries") then .entries else [] end | .[] | [(.run_id // .runId // "?"), (.id // "?"), (.name // "?"), (.status // "?")] | @tsv' /tmp/tasks.json > /tmp/all.txt || echo "jq failed"
            grep -E "failure" /tmp/all.txt | grep -iE "release" | head -8 || echo "no failed release tasks matched"
          } >>"$out" 2>&1
          # Fetch logs for each failed Release-ish task by task id, then also by run id.
          while IFS=$'\t' read -r run job name status; do
            [ "$job" = "?" ] && continue
            {
              echo "=== task $job run $run: $name ==="
              apiget "$api/actions/jobs/$job/logs" | tail -c 12000
              echo
            } >>"$out" 2>&1
          done < <(grep -E "failure" /tmp/all.txt | grep -iE "release" | head -8)
          wc -c "$out"
          git config --local user.name probe
          git config --local user.email probe@terrascale.tech
          git config --local credential.helper \
            '!f() { echo username=forgejo-actions; echo "password=$FORGEJO_TOKEN"; }; f'
          git add "$out"
          git commit -qm "failed job logs" || true
          git push "https://git.terrascale.tech/TerraScale/ku.git" "+HEAD:refs/heads/probe-results"
