name: Probe

# Throwaway diagnostics: exercises the job token's registry, issue and
# log-read capabilities and reports the outcomes to the probe-results
# branch (the job-token git push is the one channel proven to work).
on: workflow_dispatch

jobs:
  probe:
    name: Probe job token capabilities
    runs-on: terrascale-builder
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      issues: write
      packages: write
    steps:
      - name: Check out the probe branch
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Run the probes and publish findings
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
        run: |
          set -u
          api=https://git.terrascale.tech/api/v1/repos/TerraScale/ku
          reg=https://git.terrascale.tech/v2
          {
            echo "actor=$FORGEJO_ACTOR"
            # Registry auth as the job token: the /v2/ ping and a push-scope probe.
            echo "registry ping: $(curl -s -o /tmp/r1 -w '%{http_code}' -u "$FORGEJO_ACTOR:$FORGEJO_TOKEN" "$reg/")"
            echo "registry ping body: $(head -c 200 /tmp/r1)"
            echo "blob upload begin: $(curl -s -o /tmp/r2 -w '%{http_code}' -u "$FORGEJO_ACTOR:$FORGEJO_TOKEN" -X POST "$reg/terrascale/ku/blobs/uploads/")"
            echo "blob upload body: $(head -c 200 /tmp/r2)"
            # Issue creation as the job token.
            echo "issue create: $(curl -s -o /tmp/i1 -w '%{http_code}' -H "Authorization: token $FORGEJO_TOKEN" -H 'Content-Type: application/json' -d '{"title":"probe: job token issue write"}' "$api/issues")"
            echo "issue body: $(head -c 200 /tmp/i1)"
            # Reading this run's job logs as the job token (report-failure.sh depends on it).
            echo "run jobs list: $(curl -s -o /tmp/j1 -w '%{http_code}' -H "Authorization: token $FORGEJO_TOKEN" "$api/actions/runs/$GITHUB_RUN_ID/jobs")"
            echo "run jobs body: $(head -c 200 /tmp/j1)"
            # Repo read as the job token.
            echo "repo read: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $FORGEJO_TOKEN" "$api")"
          } > probe-results.txt 2>&1
          cat probe-results.txt
          # Publish through the job-token git push channel.
          git config --local user.name probe
          git config --local user.email probe@terrascale.tech
          git config --local credential.helper \
            '!f() { echo username=forgejo-actions; echo "password=$FORGEJO_TOKEN"; }; f'
          git add probe-results.txt
          git commit -qm "probe results"
          git push "https://git.terrascale.tech/TerraScale/ku.git" "HEAD:refs/heads/probe-results"
