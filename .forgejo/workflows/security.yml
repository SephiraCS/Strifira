name: Security Scan

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

# Pull requests run per ref and yield to newer pushes. Tag and nightly runs
# share one queue, so two of them never file the same failure issue at once
# (Forgejo has no job-level concurrency; scripts/ci/report-failure.sh also
# folds a duplicate opened in a race into the oldest issue).
concurrency:
  group: ku-${{ forgejo.workflow }}-${{ forgejo.event_name == 'pull_request' && forgejo.ref || 'scheduled' }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

# govulncheck is baked into the ts-builder job image. Container images are
# scanned by image-security.yml; build, vet, and test coverage lives in ci.yml.
jobs:
  zero-config:
    name: Reject new configuration switches
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the exact change with its history
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared TerraScale policy
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          repository: TerraScale/ts-builder
          ref: 4abae826a08090c4505d7c8f3d7adcd78be616ef
          path: .zero-config-policy
          token: ${{ secrets.TERRASCALE_BOT_TOKEN }}
          persist-credentials: false
      - name: Check the added lines
        env:
          ZERO_CONFIG_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
          ZERO_CONFIG_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 .zero-config-policy/scripts/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"

  go-security:
    needs: [zero-config]
    name: Go Security Scan
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          persist-credentials: false

      - name: Run govulncheck
        working-directory: BE
        run: govulncheck ./...

  frontend-security:
    needs: [zero-config]
    name: Frontend Security Scan
    runs-on: terrascale-builder
    timeout-minutes: 15
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          persist-credentials: false

      # npm audit reads the lockfile; no install needed.
      - name: Run npm audit
        working-directory: UI
        run: npm audit --audit-level=high

  # Nightly and tag scans gate nothing, so a failure files (or updates) a
  # Forgejo issue instead of going unnoticed. Pull requests show their own.
  report:
    name: Report the failure
    needs: [zero-config, go-security, frontend-security]
    if: failure() && needs.zero-config.result == 'success' && forgejo.event_name != 'pull_request'
    runs-on: terrascale-builder
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          persist-credentials: false

      - name: File the failure as an issue
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          REPORT_TITLE: 'Security scan failed'
          REPRO: |
            (cd BE && govulncheck ./...)
            (cd UI && npm audit --audit-level=high)
        run: scripts/ci/report-failure.sh
