name: Security Scan

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

jobs:
  go-security:
    name: Go Security Scan
    runs-on: terrascale-builder
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./BE
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Set up Go
        uses: https://data.forgejo.org/actions/setup-go@v6.4.0
        with:
          go-version-file: BE/go.mod
          cache: false

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build check
        run: go build ./...

      - name: Run tests
        run: go test ./... -race -count=1

  frontend-security:
    name: Frontend Security Scan
    runs-on: terrascale-builder
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./UI
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Build check
        run: npm run build

  docker-security:
    name: Container Security Scan
    runs-on: terrascale-builder
    timeout-minutes: 60
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Check for a usable Docker daemon
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker is not usable from this job; skipping container security scans."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build images
        if: steps.docker.outputs.available == 'true'
        run: |
          docker build --pull --tag ku-backend:scan ./BE
          docker build --pull --tag ku-frontend:scan ./UI

      - name: Install Trivy
        if: steps.docker.outputs.available == 'true'
        run: |
          command -v trivy >/dev/null 2>&1 && exit 0
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Scan backend image
        if: steps.docker.outputs.available == 'true'
        run: trivy image --severity CRITICAL,HIGH --exit-code 1 ku-backend:scan

      - name: Scan frontend image
        if: steps.docker.outputs.available == 'true'
        run: trivy image --severity CRITICAL,HIGH --exit-code 1 ku-frontend:scan

  dev-machine-security:
    name: Dev Machine Security Scan
    runs-on: terrascale-builder
    timeout-minutes: 90
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Check for a usable Docker daemon
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker is not usable from this job; skipping dev machine security scans."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Trivy
        if: steps.docker.outputs.available == 'true'
        run: |
          command -v trivy >/dev/null 2>&1 && exit 0
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      # Single job instead of a matrix: the images are built and scanned
      # sequentially on the shared runner anyway, and one container per matrix
      # leg would add nine checkouts and job startups per scan.
      - name: Build and scan dev machine images
        if: steps.docker.outputs.available == 'true'
        run: |
          set -u
          status=0
          while read -r id context file extra; do
            [ -n "${id:-}" ] || continue
            echo "::group::dev-machine ${id}"
            build_args=""
            if [ -n "${extra:-}" ]; then
              build_args="$extra"
            fi
            if docker build --pull ${build_args} --tag "ku-dev-machine-${id}:scan" --file "$file" "$context" \
              && trivy image --severity CRITICAL,HIGH --exit-code 1 "ku-dev-machine-${id}:scan"; then
              echo "dev-machine ${id}: OK"
            else
              echo "dev-machine ${id}: FAILED"
              status=1
            fi
            echo "::endgroup::"
          done <<'IMAGES'
          gateway ./BE ./BE/Dockerfile.machine-gateway
          manager ./BE ./BE/Dockerfile.machine-manager
          ide ./devmachine ./devmachine/ide/Dockerfile
          browser ./devmachine ./devmachine/browser/Dockerfile
          collector ./devmachine ./devmachine/collector/Dockerfile
          egress ./devmachine ./devmachine/egress/Dockerfile
          agent-claude ./devmachine ./devmachine/agent/Dockerfile --build-arg PROVIDER=claude-code
          agent-opencode ./devmachine ./devmachine/agent/Dockerfile --build-arg PROVIDER=opencode
          agent-codex ./devmachine ./devmachine/agent/Dockerfile --build-arg PROVIDER=codex
          IMAGES
          exit "${status}"
