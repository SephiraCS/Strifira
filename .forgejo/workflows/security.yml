name: Security Scan

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

jobs:
  go-security:
    name: Go Security Scan
    runs-on: terrascale-builder
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./BE
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Set up Go
        uses: https://data.forgejo.org/actions/setup-go@v6.4.0
        with:
          # go-version-file is ignored by this action build; pin explicitly.
          go-version: '1.27'
          cache: false

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build check
        run: go build ./...

      - name: Run tests
        run: go test ./... -race -count=1

  frontend-security:
    name: Frontend Security Scan
    runs-on: terrascale-builder
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./UI
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Build check
        run: npm run build

  docker-security:
    name: Container Security Scan
    runs-on: terrascale-builder
    timeout-minutes: 60
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      # The builder image ships podman/buildah rather than a Docker CLI, so
      # image lanes run on whichever engine is usable in the job.
      - name: Detect the container engine
        id: engine
        run: |
          if command -v podman >/dev/null 2>&1 && podman info >/dev/null 2>&1; then
            echo "engine=podman" >> "$GITHUB_OUTPUT"
          elif command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "engine=docker" >> "$GITHUB_OUTPUT"
          else
            echo "engine=" >> "$GITHUB_OUTPUT"
            echo "No usable container engine (podman or docker) in this job; skipping container security scans."
          fi

      - name: Build images
        if: steps.engine.outputs.engine != ''
        env:
          ENGINE: ${{ steps.engine.outputs.engine }}
        run: |
          "$ENGINE" build --pull --tag ku-backend:scan ./BE
          "$ENGINE" build --pull --tag ku-frontend:scan ./UI

      - name: Install Trivy
        if: steps.engine.outputs.engine != ''
        run: |
          command -v trivy >/dev/null 2>&1 && exit 0
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Scan backend image
        if: steps.engine.outputs.engine != ''
        env:
          ENGINE: ${{ steps.engine.outputs.engine }}
        run: |
          "$ENGINE" save --output backend-scan.tar ku-backend:scan
          trivy image --input backend-scan.tar --severity CRITICAL,HIGH --exit-code 1

      - name: Scan frontend image
        if: steps.engine.outputs.engine != ''
        env:
          ENGINE: ${{ steps.engine.outputs.engine }}
        run: |
          "$ENGINE" save --output frontend-scan.tar ku-frontend:scan
          trivy image --input frontend-scan.tar --severity CRITICAL,HIGH --exit-code 1

  dev-machine-security:
    name: Dev Machine Security Scan
    runs-on: terrascale-builder
    timeout-minutes: 90
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Detect the container engine
        id: engine
        run: |
          if command -v podman >/dev/null 2>&1 && podman info >/dev/null 2>&1; then
            echo "engine=podman" >> "$GITHUB_OUTPUT"
          elif command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "engine=docker" >> "$GITHUB_OUTPUT"
          else
            echo "engine=" >> "$GITHUB_OUTPUT"
            echo "No usable container engine (podman or docker) in this job; skipping dev machine security scans."
          fi

      - name: Install Trivy
        if: steps.engine.outputs.engine != ''
        run: |
          command -v trivy >/dev/null 2>&1 && exit 0
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      # Single job instead of a matrix: the images are built and scanned
      # sequentially on the shared runner anyway, and one container per matrix
      # leg would add nine checkouts and job startups per scan.
      - name: Build and scan dev machine images
        if: steps.engine.outputs.engine != ''
        env:
          ENGINE: ${{ steps.engine.outputs.engine }}
        run: |
          set -u
          status=0
          while read -r id context file extra; do
            [ -n "${id:-}" ] || continue
            echo "::group::dev-machine ${id}"
            build_args=""
            [ -z "${extra:-}" ] || build_args="$extra"
            tar="/tmp/ku-dev-machine-${id}-scan.tar"
            if "$ENGINE" build --pull ${build_args} --tag "ku-dev-machine-${id}:scan" --file "$file" "$context" \
              && "$ENGINE" save --output "$tar" "ku-dev-machine-${id}:scan" \
              && trivy image --input "$tar" --severity CRITICAL,HIGH --exit-code 1; then
              echo "dev-machine ${id}: OK"
            else
              echo "dev-machine ${id}: FAILED"
              status=1
            fi
            echo "::endgroup::"
          done <<'IMAGES'
          gateway ./BE ./BE/Dockerfile.machine-gateway
          manager ./BE ./BE/Dockerfile.machine-manager
          ide ./devmachine ./devmachine/ide/Dockerfile
          browser ./devmachine ./devmachine/browser/Dockerfile
          collector ./devmachine ./devmachine/collector/Dockerfile
          egress ./devmachine ./devmachine/egress/Dockerfile
          agent-claude ./devmachine ./devmachine/agent/Dockerfile --build-arg PROVIDER=claude-code
          agent-opencode ./devmachine ./devmachine/agent/Dockerfile --build-arg PROVIDER=opencode
          agent-codex ./devmachine ./devmachine/agent/Dockerfile --build-arg PROVIDER=codex
          IMAGES
          exit "${status}"
