name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-runs the pipeline when a runner hiccup fails a good build; on main
  # that includes the deploy: `fj actions dispatch ci.yml main`.
  workflow_dispatch:

# Runs on main publish release images (the Release job), so they share the
# ku-publish-images queue with build.yml's tag publications: two publishers
# never interleave their pushes (Forgejo has no job-level concurrency).
concurrency:
  group: ${{ forgejo.ref == 'refs/heads/main' && 'ku-publish-images' || format('ku-{0}-{1}', forgejo.workflow, forgejo.ref) }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

# Go, Node.js, and the Playwright browsers are baked into the ts-builder job
# image; dependency caches live on the runner's shared /cache volume.
#
# Every push to main deploys to alpha: the image is built and staged in
# Harbor while the tests run, and the ku instance is rolled once the backend
# and frontend tests pass. The alpha side is HomeLab ops/ku/deploy.sh.
#
# Tests (AGENTS.md): integration tests only, in two suites. This workflow
# runs the fast suite (`make test-fast`), which gates the deploy; the slow
# suite (`make test-slow`) runs in slow.yml and never blocks it. After a
# good deploy the Release job bumps the version, tags and publishes it;
# pull requests never edit versions (scripts/ci/release.sh).
jobs:
  zero-config:
    name: Reject new configuration switches
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the exact change with its history
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared TerraScale policy
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          repository: TerraScale/ts-builder
          ref: 56a42e778c1cf3114b72969325fadf5b49850fca
          path: .zero-config-policy
          token: ${{ secrets.TERRASCALE_BOT_TOKEN }}
          persist-credentials: false
      - name: Check the added lines
        env:
          ZERO_CONFIG_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
          ZERO_CONFIG_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 .zero-config-policy/scripts/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"

  backend-test:
    needs: [zero-config]
    name: Backend Tests
    runs-on: terrascale-builder
    timeout-minutes: 30
    defaults:
      run:
        working-directory: BE
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Create the podman store
        working-directory: .
        run: |
          sh scripts/ci/check-image-versions.sh
          sh scripts/ci/podman-store_test.sh
          scripts/ci/podman-store.sh create backend-test

      # Runner service containers are not reachable from job containers, so
      # PostgreSQL and Redis run as podman containers inside the privileged
      # job. Nested podman needs --cgroups=disabled or conmon cannot create its
      # sandbox cgroup. Both images pull in parallel, and readiness is awaited
      # only after vet so the database initializes in the meantime.
      - name: Start PostgreSQL and Redis
        run: |
          set -euo pipefail
          # fsync off: this database is throwaway test state, and commits
          # must not overrun test deadlines on the shared runner.
          podman run --detach --cgroups=disabled --name ku-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=ku --env POSTGRES_PASSWORD=ku --env POSTGRES_DB=ku_test \
            docker.io/library/postgres:16-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off &
          postgres=$!
          podman run --detach --cgroups=disabled --name ku-redis \
            --publish 127.0.0.1:6379:6379 \
            docker.io/library/redis:7-alpine &
          redis=$!
          wait "$postgres"
          wait "$redis"

      - name: Vet
        run: go vet ./...

      - name: Wait for PostgreSQL and Redis
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            podman exec ku-postgres pg_isready -h 127.0.0.1 -U ku -d ku_test >/dev/null 2>&1 && break
            sleep 2
          done
          podman exec ku-postgres pg_isready -h 127.0.0.1 -U ku -d ku_test
          podman exec ku-redis redis-cli ping

      # Limit package concurrency on the shared runner: migrated test databases
      # and git fixtures compete for CPU and disk. The timeout covers a whole
      # package, so allow 10m while retaining stacks before the 30m job limit.
      - name: Fast suite (backend) with coverage
        working-directory: .
        env:
          DATABASE_URL: postgres://ku:ku@localhost:5432/ku_test?sslmode=disable
          TEST_DATABASE_URL: postgres://ku:ku@localhost:5432/ku_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-that-is-at-least-32-characters-long
        run: |
          set -euo pipefail
          make test-fast-backend \
            GO_TEST_FLAGS="-p=2 -race -count=1 -timeout=10m -coverprofile=coverage.out -covermode=atomic"
          (cd BE && go tool cover -func=coverage.out | tail -1)

      # Runs even when tests fail, so both problems show in one run.
      - name: Check formatting
        if: success() || failure()
        working-directory: .
        run: make check-gofmt

      - name: Remove the podman store
        if: always()
        working-directory: .
        run: scripts/ci/podman-store.sh remove

  frontend-check:
    needs: [zero-config]
    name: Frontend Checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    defaults:
      run:
        working-directory: UI
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Svelte check
        run: npm run check

  # The fast browser suite (FAST_SPECS in UI/playwright.config.ts), split
  # across three runners. Each shard builds the app itself: this runner
  # serves neither the v4 nor the legacy artifact protocol (see ts-reviewer
  # CI). Workers stay at two per shard.
  frontend-e2e:
    needs: [zero-config]
    name: Frontend Browser Tests (${{ matrix.shard }}/3)
    runs-on: terrascale-builder
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: UI
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build

      # Installs only what the job image lacks for this Playwright version
      # (a no-op once the baked browsers match).
      - name: Fast suite (browser)
        working-directory: .
        env:
          E2E_PREBUILT: '1'
        run: |
          (cd UI && npx playwright install chromium ffmpeg)
          make test-fast-frontend E2E_FLAGS="--shard=${{ matrix.shard }}/3 --workers=2"

      # Artifacts are unavailable on this runner, so failure context goes to
      # the retained job log instead.
      - name: Print failure context
        if: failure()
        run: |
          find test-results -name 'error-context.md' -print -exec cat {} \; 2>/dev/null | head -c 200000 || true

  web-check:
    needs: [zero-config]
    name: Marketing Site Checks
    runs-on: terrascale-builder
    timeout-minutes: 30
    defaults:
      run:
        working-directory: WEB
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Svelte check
        run: npm run check

      - name: Build and SEO validation
        run: npm run validate

      - name: Responsive layout tests
        run: npm run test:responsive

  stage-image:
    needs: [zero-config]
    name: Stage Image
    if: forgejo.event_name != 'pull_request' && forgejo.ref == 'refs/heads/main'
    runs-on: terrascale-builder
    timeout-minutes: 30
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Create the podman store
        run: scripts/ci/podman-store.sh create stage-image

      - name: Build the image
        run: scripts/ci/build-image.sh go,npm --build-arg "KU_VERSION=${{ forgejo.sha }}" --tag "ku:${{ forgejo.sha }}" .

      - name: Stage the image in Harbor
        env:
          ALPHA_DEPLOY_SSH_KEY: ${{ secrets.ALPHA_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          podman save --format docker-archive "ku:${{ forgejo.sha }}" \
            | scripts/alpha-deploy.sh stage "${{ forgejo.sha }}"

      - name: Remove the podman store
        if: always()
        run: scripts/ci/podman-store.sh remove

  deploy:
    name: Deploy to Alpha
    needs: [backend-test, frontend-check, frontend-e2e, stage-image]
    if: forgejo.event_name != 'pull_request' && forgejo.ref == 'refs/heads/main'
    runs-on: terrascale-builder
    timeout-minutes: 20
    env:
      # Public endpoint of the alpha instance (HomeLab services/ku.md).
      ALPHA_HEALTH_URL: https://ku.mariogk.com/health
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      # The commit to name in rollback instructions: what the public
      # endpoint serves now, or (for images older than the version field)
      # the last fully green push to main.
      - name: Record the running commit
        id: previous
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          set -u
          previous=$(curl --silent --fail --max-time 10 "${ALPHA_HEALTH_URL}" | jq -r '.version // empty' 2>/dev/null || true)
          if ! printf '%s' "$previous" | grep -Eq '^[0-9a-f]{40}$'; then
            previous=$(curl --silent --fail --max-time 10 --header "Authorization: token ${FORGEJO_TOKEN}" \
              "https://git.terrascale.tech/api/v1/repos/TerraScale/ku/actions/runs?workflow_id=ci.yml&event=push&status=success&limit=5" \
              | jq -r --arg sha "${{ forgejo.sha }}" '[.workflow_runs[] | select(.commit_sha != $sha)][0].commit_sha // "unknown"' 2>/dev/null || echo unknown)
          fi
          echo "Alpha runs ${previous} before this deploy."
          echo "sha=${previous}" >> "$GITHUB_OUTPUT"

      - name: Roll the ku instance
        env:
          ALPHA_DEPLOY_SSH_KEY: ${{ secrets.ALPHA_DEPLOY_SSH_KEY }}
        run: scripts/alpha-deploy.sh roll "${{ forgejo.sha }}"

      # ku-deploy only checks alpha's loopback; this checks what users get.
      - name: Verify the deployed commit
        run: scripts/ci/verify-deploy.sh "${ALPHA_HEALTH_URL}" "${{ forgejo.sha }}" "${{ steps.previous.outputs.sha }}"

      - name: Explain the rollback
        if: failure()
        env:
          PREVIOUS: ${{ steps.previous.outputs.sha }}
        run: |
          echo "::error::Deploy of ${{ forgejo.sha }} failed. Alpha ran ${PREVIOUS:-unknown} before it."
          echo "ku-deploy rolls back by itself when the new image never turns healthy."
          echo "To roll back by hand, on alpha: sudo -u ku-deploy /usr/local/sbin/ku-deploy roll ${PREVIOUS:-<previous sha>}"

  # Cuts the next patch release of the deployed commit: bumps UI/package.json
  # and the OpenAPI version in a "[skip ci]" commit on main, tags it, creates
  # the release, pushes the images built from it, and rolls alpha to that
  # release commit so it serves the new version. It runs after the deploy
  # and never blocks it. No loop: Forgejo starts no workflow for
  # pushes made with the job token (see scripts/ci/release.sh).
  release:
    name: Release
    needs: [deploy]
    if: forgejo.event_name != 'pull_request' && forgejo.ref == 'refs/heads/main'
    runs-on: terrascale-builder
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: git.terrascale.tech
      IMAGE_PREFIX: git.terrascale.tech/terrascale
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false
          fetch-depth: 0

      - name: Bump the version, tag and create the release
        id: release
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: scripts/ci/release.sh "${{ forgejo.sha }}"

      - name: Create the podman store
        if: steps.release.outputs.version != ''
        run: scripts/ci/podman-store.sh create release

      - name: Build and push the release images
        if: steps.release.outputs.version != ''
        env:
          # Forgejo's automatic job token cannot push packages; the
          # REGISTRY_PUSH_TOKEN secret (write:package) takes over once set.
          FORGEJO_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN || forgejo.token }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
        run: scripts/ci/publish-images.sh "${{ steps.release.outputs.version }}" --push

      # The release commit carries the new version and release manifest the
      # UI serves; roll alpha to it (only from the commit it bumps).
      - name: Deploy the release commit to alpha
        if: steps.release.outputs.version != ''
        env:
          ALPHA_DEPLOY_SSH_KEY: ${{ secrets.ALPHA_DEPLOY_SSH_KEY }}
          ALPHA_HEALTH_URL: https://ku.mariogk.com/health
        run: >-
          scripts/ci/deploy-release.sh "${ALPHA_HEALTH_URL}"
          "${IMAGE_PREFIX}/ku:${{ steps.release.outputs.version }}"
          "${{ steps.release.outputs.sha }}" "${{ steps.release.outputs.deployed }}"

      - name: Remove the podman store
        if: always()
        run: scripts/ci/podman-store.sh remove

  # The Release job has never published its images on this Forgejo (see the
  # TS-423 notes: the job token pushing packages was unproven). Its failure
  # gates nothing the deploy needs, so it must be seen and owned the same
  # way slow-suite failures are: one open issue collects the redacted log
  # tails of every failed job.
  report-release-failure:
    name: Report the release failure
    needs: [release]
    # failure() chained with && never fired here; always() plus the explicit
    # needs result is the dependable form.
    if: >-
      always()
      && !cancelled()
      && needs.release.result == 'failure'
      && forgejo.event_name != 'pull_request'
      && forgejo.ref == 'refs/heads/main'
    runs-on: terrascale-builder
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # The action mirror (data.forgejo.org) intermittently fails to resolve
      # the pinned checkout commit, which kills this job before it can report;
      # try once more before giving up.
      - name: Check out the source revision
        id: checkout
        continue-on-error: true
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Check out the source revision (retry)
        id: checkout_retry
        if: steps.checkout.outcome == 'failure'
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: File the failure as an issue
        if: steps.checkout.outcome == 'success' || steps.checkout_retry.outcome == 'success'
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          REPORT_TITLE: 'Release failed'
          LOG_LINES: 150
          REPRO: |
            # The release resumes idempotently once the cause is fixed:
            fj actions dispatch ci.yml main
        run: scripts/ci/report-failure.sh
