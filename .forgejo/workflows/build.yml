name: Build & Push

# Releases are cut automatically: after every successful Deploy to Alpha on
# main, the Release job of ci.yml bumps the patch version, tags it, creates
# the Forgejo release and pushes the images itself (scripts/ci/release.sh and
# scripts/ci/publish-images.sh). Its tag push uses the job token, which never
# starts workflows, so this workflow does not run for those releases.
#
# This workflow covers the rest: a v* tag pushed by a person, including one
# created with a release in the web UI (it creates the release if missing
# and pushes the images), and a manual dispatch, which builds the
# checked-out commit without pushing. It never
# commits: versions are bumped only by ci.yml. Pull requests do not build
# here: image-security.yml builds every Dockerfile when an image input
# changes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Tag publications queue with ci.yml's runs on main, which publish the
# automatic releases, so two publishers never interleave their pushes.
concurrency:
  group: ${{ forgejo.event_name == 'push' && 'ku-publish-images' || format('ku-{0}-{1}', forgejo.workflow, forgejo.ref) }}
  cancel-in-progress: false

env:
  # Docker references must be lowercase; the Forgejo registry resolves the
  # lowercase owner path to the TerraScale organization.
  REGISTRY: git.terrascale.tech
  IMAGE_PREFIX: git.terrascale.tech/terrascale

permissions:
  contents: write
  packages: write

jobs:
  zero-config:
    name: Reject new configuration switches
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the exact change with its history
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared TerraScale policy
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          repository: TerraScale/ts-builder
          ref: 2d365b52e7e6379593839ad912ecf60d81fd23b5
          path: .zero-config-policy
          token: ${{ secrets.TERRASCALE_BOT_TOKEN }}
          persist-credentials: false
      - name: Check the added lines
        env:
          ZERO_CONFIG_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
          ZERO_CONFIG_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 .zero-config-policy/scripts/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"

  build:
    needs: [zero-config]
    name: Build Images
    runs-on: terrascale-builder
    timeout-minutes: 60

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.sha }}
          persist-credentials: false
          # All tags: publish-images.sh only moves latest for the newest one.
          fetch-depth: 0

      - name: Extract version
        id: version
        env:
          EVENT: ${{ forgejo.event_name }}
          REF_NAME: ${{ forgejo.ref_name }}
        run: |
          case "${EVENT}" in
            push) version="${REF_NAME}"; push=true ;;
            *) version="dev-$(git rev-parse --short HEAD)"; push=false ;;
          esac
          {
            echo "version=$version"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"

      # The temporary release-trigger.yml used to do this for pushed tags.
      - name: Create the Forgejo release
        if: forgejo.event_name == 'push'
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          code="$(curl -s -w '%{http_code}' -o /tmp/release.json \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":false}" \
            https://git.terrascale.tech/api/v1/repos/TerraScale/ku/releases)"
          case "${code}" in
            201) echo "release ${TAG} created" ;;
            409) echo "release ${TAG} already exists" ;;
            *) echo "release creation failed with HTTP ${code}:" >&2; cat /tmp/release.json >&2; exit 1 ;;
          esac

      - name: Create the podman store
        run: scripts/ci/podman-store.sh create build

      - name: Build and push the images
        env:
          # Forgejo's automatic job token cannot push packages; the
          # REGISTRY_PUSH_TOKEN secret (write:package) takes over once set.
          FORGEJO_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN || forgejo.token }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
          VERSION: ${{ steps.version.outputs.version }}
          PUSH: ${{ steps.version.outputs.push }}
        run: |
          if [ "${PUSH}" = true ]; then
            scripts/ci/publish-images.sh "${VERSION}" --push
          else
            scripts/ci/publish-images.sh "${VERSION}"
          fi

      - name: Remove the podman store
        if: always()
        run: scripts/ci/podman-store.sh remove
