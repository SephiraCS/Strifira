name: Build & Push

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Docker references must be lowercase; the Forgejo registry resolves the
  # lowercase owner path to the TerraScale organization.
  REGISTRY: git.terrascale.tech
  IMAGE_PREFIX: git.terrascale.tech/terrascale

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Images
    runs-on: terrascale-builder
    timeout-minutes: 60

    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.sha }}
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          case "${{ forgejo.event_name }}" in
            release)
              version="${{ forgejo.event.release.tag_name }}"
              number="${version#v}"
              push="true"
              ;;
            pull_request)
              version="pr-${{ forgejo.event.number }}"
              number="0.0.0"
              push="false"
              ;;
            *)
              version="dev-$(git rev-parse --short HEAD)"
              number="0.0.0"
              push="false"
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Bump UI version
        if: forgejo.event_name == 'release'
        working-directory: UI
        env:
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        run: npm version "${VERSION_NUMBER}" --no-git-tag-version --allow-same-version

      - name: Update public release manifest
        if: forgejo.event_name == 'release'
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            "https://git.terrascale.tech/api/v1/repos/TerraScale/ku/releases?limit=100" \
            | jq '[.[] | select(.draft == false) | {
                tag_name,
                html_url,
                body,
                published_at: .created_at,
                prerelease: (.prerelease // false),
                force_upgrade: false,
                minimum_supported_version: null,
                upgrade_url: .html_url,
                upgrade_message: null
              }]' \
            > UI/static/releases.json

      # The upstream contributors list came from the GitHub API, which has no
      # Forgejo equivalent; the README contributor section is left as authored.
      - name: Commit version bump
        if: forgejo.event_name == 'release'
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "noreply@git.terrascale.tech"
          git add UI/package.json UI/package-lock.json UI/static/releases.json

          if git diff --cached --quiet; then
            echo "Version is already ${VERSION}"
          else
            git commit -m "bump(version): ${VERSION}"
            git push "https://${FORGEJO_ACTOR}:${FORGEJO_TOKEN}@git.terrascale.tech/TerraScale/ku.git" HEAD:main
          fi

      # The builder image ships podman/buildah rather than a Docker CLI, so
      # image lanes run on whichever engine is usable in the job.
      - name: Detect the container engine
        id: engine
        run: |
          if command -v podman >/dev/null 2>&1 && podman info >/dev/null 2>&1; then
            echo "engine=podman" >> "$GITHUB_OUTPUT"
          elif command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "engine=docker" >> "$GITHUB_OUTPUT"
          else
            echo "engine=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail fast when no container engine is available on a release
        if: forgejo.event_name == 'release' && steps.engine.outputs.engine == ''
        run: |
          echo "A usable container engine (podman or docker) is required to publish release images." >&2
          exit 1

      # The job environment presets REGISTRY_AUTH_FILE to a read-only,
      # pull-only Harbor authfile. Copy it, add the Forgejo registry
      # credentials, and point podman at the merged copy so base-image pulls
      # keep working through the Harbor mirror while pushes authenticate to
      # the Forgejo registry. The docker engine ignores this variable.
      - name: Log in to the Forgejo container registry
        if: forgejo.event_name == 'release'
        id: auth
        env:
          ENGINE: ${{ steps.engine.outputs.engine }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
        run: |
          authfile="${RUNNER_TEMP}/ci-registry-auth.json"
          cp "${REGISTRY_AUTH_FILE:-/dev/null}" "$authfile" 2>/dev/null || touch "$authfile"
          if [ "$ENGINE" = "podman" ]; then
            printf '%s' "${FORGEJO_TOKEN}" | podman login --authfile "$authfile" "${REGISTRY}" --username "${FORGEJO_ACTOR}" --password-stdin
          else
            printf '%s' "${FORGEJO_TOKEN}" | docker login "${REGISTRY}" --username "${FORGEJO_ACTOR}" --password-stdin
          fi
          echo "authfile=$authfile" >> "$GITHUB_OUTPUT"

      # All-in-one image
      - name: Build & push all-in-one
        env:
          ENGINE: ${{ steps.engine.outputs.engine }}
          AUTHFILE: ${{ steps.auth.outputs.authfile }}
          VERSION: ${{ steps.version.outputs.version }}
          PUSH: ${{ steps.version.outputs.push }}
        run: |
          if [ -n "${AUTHFILE:-}" ]; then export REGISTRY_AUTH_FILE="$AUTHFILE"; fi
          "$ENGINE" build --pull \
            --tag "${IMAGE_PREFIX}/ku:latest" \
            --tag "${IMAGE_PREFIX}/ku:${VERSION}" \
            .
          if [ "${PUSH}" = "true" ]; then
            "$ENGINE" push "${IMAGE_PREFIX}/ku:latest"
            "$ENGINE" push "${IMAGE_PREFIX}/ku:${VERSION}"
          fi

      # API-only image
      - name: Build & push API
        env:
          ENGINE: ${{ steps.engine.outputs.engine }}
          AUTHFILE: ${{ steps.auth.outputs.authfile }}
          VERSION: ${{ steps.version.outputs.version }}
          PUSH: ${{ steps.version.outputs.push }}
        run: |
          if [ -n "${AUTHFILE:-}" ]; then export REGISTRY_AUTH_FILE="$AUTHFILE"; fi
          "$ENGINE" build --pull \
            --tag "${IMAGE_PREFIX}/ku-api:latest" \
            --tag "${IMAGE_PREFIX}/ku-api:${VERSION}" \
            ./BE
          if [ "${PUSH}" = "true" ]; then
            "$ENGINE" push "${IMAGE_PREFIX}/ku-api:latest"
            "$ENGINE" push "${IMAGE_PREFIX}/ku-api:${VERSION}"
          fi

      # Web-only image
      - name: Build & push Web
        env:
          ENGINE: ${{ steps.engine.outputs.engine }}
          AUTHFILE: ${{ steps.auth.outputs.authfile }}
          VERSION: ${{ steps.version.outputs.version }}
          PUSH: ${{ steps.version.outputs.push }}
        run: |
          if [ -n "${AUTHFILE:-}" ]; then export REGISTRY_AUTH_FILE="$AUTHFILE"; fi
          "$ENGINE" build --pull \
            --tag "${IMAGE_PREFIX}/ku-web:latest" \
            --tag "${IMAGE_PREFIX}/ku-web:${VERSION}" \
            ./UI
          if [ "${PUSH}" = "true" ]; then
            "$ENGINE" push "${IMAGE_PREFIX}/ku-web:latest"
            "$ENGINE" push "${IMAGE_PREFIX}/ku-web:${VERSION}"
          fi

  # TEMPORARY: after a release, pulls every published image back from the
  # Forgejo registry with the job token and records the outcome on the
  # ci/status branch, so the registry publication is verifiable without web
  # access. Remove once the release lane is verified.
  verify-publish:
    name: Verify published images (temporary)
    if: always() && forgejo.event_name == 'release'
    needs: build
    runs-on: terrascale-builder
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false

      - name: Pull published images from the Forgejo registry
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
          VERSION: ${{ forgejo.event.release.tag_name }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          authfile="$(mktemp)"
          printf '%s' "${FORGEJO_TOKEN}" | podman login --authfile "$authfile" "${REGISTRY}" --username "${FORGEJO_ACTOR}" --password-stdin

          {
            echo "release verify at $(date -u +%Y-%m-%dT%H:%M:%SZ) version=${VERSION}"
            echo "build job result: ${BUILD_RESULT}"
            for image in ku ku-api ku-web; do
              ref="${REGISTRY}/terrascale/${image}:${VERSION}"
              if podman pull --authfile "$authfile" "$ref" >/dev/null 2>&1; then
                echo "PULL OK    ${ref}"
                podman rmi "$ref" >/dev/null 2>&1 || true
              else
                echo "PULL FAILED ${ref}"
              fi
            done
          } | tee "release-verify-${stamp}.txt"

          git config user.name "forgejo-actions[bot]"
          git config user.email "noreply@git.terrascale.tech"
          git checkout -B ci/status "origin/ci/status" 2>/dev/null || git checkout -B ci/status
          git add "release-verify-${stamp}.txt"
          git commit -m "release verify ${stamp}"
          git push "https://${FORGEJO_ACTOR}:${FORGEJO_TOKEN}@git.terrascale.tech/TerraScale/ku.git" HEAD:ci/status
