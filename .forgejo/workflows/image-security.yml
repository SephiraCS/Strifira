name: Image Security Scan

# Pull requests build and scan only the images whose inputs they change;
# source-only changes are covered by ci.yml. Tags and the nightly run always
# scan every image, which also catches new advisories against unchanged ones.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - '**/Dockerfile*'
      - '**/.dockerignore'
      - 'devmachine/**'
      - 'BE/go.mod'
      - 'BE/go.sum'
      - 'UI/package.json'
      - 'UI/package-lock.json'
      - 'UI/Caddyfile'
      - '.forgejo/workflows/image-security.yml'
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ku-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

# Trivy and podman are baked into the ts-builder job image; the Trivy
# vulnerability DB is cached on the runner's shared /cache volume.
jobs:
  image-security:
    name: Image Security Scan (${{ matrix.id }})
    runs-on: terrascale-builder
    timeout-minutes: 45
    # Keep expensive nested image builds bounded so the shared Docker daemon
    # can also create and clean up test jobs. Every image still gets scanned.
    # The app leg builds the root Dockerfile that ci.yml stages and build.yml ships.
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: app, context: ., file: ./Dockerfile, inputs: 'Dockerfile .dockerignore BE/go.mod BE/go.sum UI/package.json UI/package-lock.json' }
          - { id: backend, context: ./BE, file: ./BE/Dockerfile, inputs: 'BE/Dockerfile BE/go.mod BE/go.sum' }
          - { id: frontend, context: ./UI, file: ./UI/Dockerfile, inputs: 'UI/Dockerfile UI/.dockerignore UI/Caddyfile UI/package.json UI/package-lock.json' }
          - { id: gateway, context: ./BE, file: ./BE/Dockerfile.machine-gateway, inputs: 'BE/Dockerfile.machine-gateway BE/go.mod BE/go.sum' }
          - { id: manager, context: ./BE, file: ./BE/Dockerfile.machine-manager, inputs: 'BE/Dockerfile.machine-manager BE/go.mod BE/go.sum' }
          - { id: ide, context: ./devmachine, file: ./devmachine/ide/Dockerfile, inputs: devmachine }
          - { id: browser, context: ./devmachine, file: ./devmachine/browser/Dockerfile, inputs: devmachine }
          - { id: collector, context: ./devmachine, file: ./devmachine/collector/Dockerfile, inputs: devmachine }
          - { id: egress, context: ./devmachine, file: ./devmachine/egress/Dockerfile, inputs: devmachine }
          - { id: agent-claude, context: ./devmachine, file: ./devmachine/agent/Dockerfile, provider: claude-code, inputs: devmachine }
          - { id: agent-opencode, context: ./devmachine, file: ./devmachine/agent/Dockerfile, provider: opencode, inputs: devmachine }
          - { id: agent-codex, context: ./devmachine, file: ./devmachine/agent/Dockerfile, provider: codex, inputs: devmachine }
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          persist-credentials: false
          # Pull requests need the merge base to tell what they change.
          fetch-depth: ${{ forgejo.event_name == 'pull_request' && '0' || '1' }}

      # Every deploying change bumps UI/package.json, which used to rebuild
      # all twelve images on the shared runner. A leg whose inputs the pull
      # request leaves alone skips its build; if the diff itself fails, the
      # leg builds and scans anyway.
      - name: Check whether this pull request changes the image
        id: inputs
        if: forgejo.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
          INPUTS: ${{ matrix.inputs }}
        run: |
          # shellcheck disable=SC2086 # INPUTS is a space-separated path list
          if git diff --quiet "${BASE_SHA}...HEAD" -- $INPUTS .forgejo/workflows/image-security.yml; then
            echo "This pull request does not change the ${{ matrix.id }} image; skipping it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Intermediate layers are never reused here, and committing one per
      # instruction is what pushed parallel legs past the runner's Docker
      # timeouts; the final image content is the same either way.
      - name: Build the image
        if: steps.inputs.outputs.skip != 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          podman build --pull --layers=false ${PROVIDER:+--build-arg "PROVIDER=${PROVIDER}"} \
            --tag "ku-${{ matrix.id }}:scan" --file "${{ matrix.file }}" "${{ matrix.context }}"
          podman save --output "${RUNNER_TEMP:-/tmp}/ku-${{ matrix.id }}.tar" "ku-${{ matrix.id }}:scan"

      # Every leg shares /cache/trivy. The vulnerability DB is opened
      # read-only, but its refresh and Trivy's BoltDB scan cache take
      # exclusive locks, so parallel legs failed with "cache may be in use by
      # another process". One leg at a time refreshes the DB; scans keep
      # their layer cache in memory.
      - name: Scan the image
        if: steps.inputs.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${TRIVY_CACHE_DIR}"
          flock "${TRIVY_CACHE_DIR}/db.lock" trivy image --download-db-only
          trivy image --cache-backend memory --skip-db-update \
            --input "${RUNNER_TEMP:-/tmp}/ku-${{ matrix.id }}.tar" --severity CRITICAL,HIGH --exit-code 1
