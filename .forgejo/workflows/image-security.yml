name: Image Security Scan

# Pull requests build and scan only the images whose inputs they change;
# source-only changes are covered by ci.yml. Tags and the nightly run always
# scan every image, which also catches new advisories against unchanged ones.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - '**/Dockerfile*'
      - '**/.dockerignore'
      - 'devmachine/**'
      - 'BE/go.mod'
      - 'BE/go.sum'
      - 'UI/package.json'
      - 'UI/package-lock.json'
      - 'UI/Caddyfile'
      - 'scripts/ci/**'
      - '.forgejo/workflows/image-security.yml'
  schedule:
    - cron: '0 0 * * *'

# Pull requests run per ref and yield to newer pushes. Tag and nightly runs
# share one queue, so two of them never file the same failure issue at once
# (Forgejo has no job-level concurrency; scripts/ci/report-failure.sh also
# folds a duplicate opened in a race into the oldest issue).
concurrency:
  group: ku-${{ forgejo.workflow }}-${{ forgejo.event_name == 'pull_request' && forgejo.ref || 'scheduled' }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

# Trivy and podman are baked into the ts-builder job image; the Trivy
# vulnerability DB is cached on the runner's shared /cache volume.
jobs:
  zero-config:
    name: Reject new configuration switches
    runs-on: terrascale-builder
    timeout-minutes: 10
    steps:
      - name: Check out the exact change with its history
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared TerraScale policy
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          repository: TerraScale/ts-builder
          ref: 4abae826a08090c4505d7c8f3d7adcd78be616ef
          path: .zero-config-policy
          token: ${{ secrets.TERRASCALE_BOT_TOKEN }}
          persist-credentials: false
      - name: Check the added lines
        env:
          ZERO_CONFIG_BASE: ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
          ZERO_CONFIG_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          set -eu
          if [ -z "$ZERO_CONFIG_BASE" ]; then
            ZERO_CONFIG_BASE=$(git rev-parse "$ZERO_CONFIG_HEAD^")
          fi
          python3 .zero-config-policy/scripts/zero-config-check.py "$ZERO_CONFIG_BASE" "$ZERO_CONFIG_HEAD"

  image-security:
    needs: [zero-config]
    name: Image Security Scan (${{ matrix.id }})
    runs-on: terrascale-builder
    timeout-minutes: 45
    # Keep expensive nested image builds bounded so the shared Docker daemon
    # can also create and clean up test jobs. Every image still gets scanned.
    # The app leg builds the root Dockerfile that ci.yml stages and build.yml ships.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: app, context: ., file: ./Dockerfile, caches: 'go,npm', inputs: 'Dockerfile .dockerignore BE/go.mod BE/go.sum UI/package.json UI/package-lock.json' }
          - { id: backend, context: ./BE, file: ./BE/Dockerfile, caches: go, inputs: 'BE/Dockerfile BE/go.mod BE/go.sum' }
          - { id: frontend, context: ./UI, file: ./UI/Dockerfile, caches: 'go,npm', inputs: 'UI/Dockerfile UI/.dockerignore UI/Caddyfile UI/package.json UI/package-lock.json' }
          - { id: gateway, context: ./BE, file: ./BE/Dockerfile.machine-gateway, caches: go, inputs: 'BE/Dockerfile.machine-gateway BE/go.mod BE/go.sum' }
          - { id: manager, context: ./BE, file: ./BE/Dockerfile.machine-manager, caches: go, inputs: 'BE/Dockerfile.machine-manager BE/go.mod BE/go.sum' }
          # The ide and agent images delete /root/.npm, so they get no npm cache.
          - { id: ide, context: ./devmachine, file: ./devmachine/ide/Dockerfile, caches: none, inputs: devmachine }
          - { id: browser, context: ./devmachine, file: ./devmachine/browser/Dockerfile, caches: go, inputs: devmachine }
          - { id: collector, context: ./devmachine, file: ./devmachine/collector/Dockerfile, caches: go, inputs: devmachine }
          - { id: egress, context: ./devmachine, file: ./devmachine/egress/Dockerfile, caches: go, inputs: devmachine }
          - { id: agent-claude, context: ./devmachine, file: ./devmachine/agent/Dockerfile, provider: claude-code, caches: none, inputs: devmachine }
          - { id: agent-opencode, context: ./devmachine, file: ./devmachine/agent/Dockerfile, provider: opencode, caches: none, inputs: devmachine }
          - { id: agent-codex, context: ./devmachine, file: ./devmachine/agent/Dockerfile, provider: codex, caches: none, inputs: devmachine }
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          persist-credentials: false
          # Pull requests need the merge base to tell what they change.
          fetch-depth: ${{ forgejo.event_name == 'pull_request' && '0' || '1' }}

      # A leg whose inputs the pull request leaves alone skips its build. The
      # release job bumps only the version in UI/package.json and its lockfile,
      # which changes nothing an image installs, so a version-only change
      # does not count (scripts/ci/image-inputs-changed.sh). If the check
      # itself fails, the leg builds and scans anyway.
      - name: Check whether this pull request changes the image
        id: inputs
        if: forgejo.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
          INPUTS: ${{ matrix.inputs }}
        run: |
          # shellcheck disable=SC2086 # INPUTS is a space-separated path list
          if ! sh scripts/ci/image-inputs-changed.sh "${BASE_SHA}" $INPUTS scripts/ci .forgejo/workflows/image-security.yml; then
            echo "This pull request does not change the ${{ matrix.id }} image; skipping it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the podman store
        if: steps.inputs.outputs.skip != 'true'
        run: scripts/ci/podman-store.sh create "image-security-${{ matrix.id }}"

      - name: Build the image
        if: steps.inputs.outputs.skip != 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          # Forgejo currently starts every matrix leg despite max-parallel.
          # Hold one of three shared slots until build/save finish. Closing
          # FD 9 in children keeps their helper processes from retaining it.
          lock_dir="${TRIVY_CACHE_DIR:?}/image-build-locks"
          mkdir -p "$lock_dir"
          while true; do
            for build_slot in 1 2 3; do
              exec 9>"$lock_dir/$build_slot.lock"
              if flock --nonblock 9; then
                break 2
              fi
              exec 9>&-
            done
            sleep 2
          done
          echo "Acquired image build slot $build_slot"
          scripts/ci/build-image.sh "${{ matrix.caches }}" --pull ${PROVIDER:+--build-arg "PROVIDER=${PROVIDER}"} \
            --tag "ku-${{ matrix.id }}:scan" --file "${{ matrix.file }}" "${{ matrix.context }}" 9>&-
          podman save --output "${PODMAN_STORE}/image.tar" "ku-${{ matrix.id }}:scan" 9>&-

      # Every leg shares /cache/trivy. The vulnerability DB is opened
      # read-only, but its refresh and Trivy's BoltDB scan cache take
      # exclusive locks, so parallel legs failed with "cache may be in use by
      # another process". One leg at a time refreshes the DB; scans keep
      # their layer cache in memory.
      - name: Scan the image
        if: steps.inputs.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${TRIVY_CACHE_DIR}"
          flock "${TRIVY_CACHE_DIR}/db.lock" trivy image --download-db-only
          trivy image --cache-backend memory --skip-db-update \
            --input "${PODMAN_STORE}/image.tar" --severity CRITICAL,HIGH --exit-code 1 \
            --ignorefile .trivyignore.yaml

      - name: Remove the podman store
        if: always()
        run: scripts/ci/podman-store.sh remove

  # Nightly and tag scans gate nothing, so a failure files (or updates) a
  # Forgejo issue instead of going unnoticed. Pull requests show their own.
  report:
    name: Report the failure
    needs: [zero-config, image-security]
    if: failure() && needs.zero-config.result == 'success' && forgejo.event_name != 'pull_request'
    runs-on: terrascale-builder
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out the source revision
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          github-server-url: https://git.terrascale.tech
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          persist-credentials: false

      - name: File the failure as an issue
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          REPORT_TITLE: 'Image security scan failed'
          REPRO: |
            # Build and scan one image the way the failed leg does, e.g. the app:
            podman build --format docker -t ku-app:scan .
            trivy image --severity CRITICAL,HIGH --exit-code 1 ku-app:scan
        run: scripts/ci/report-failure.sh
